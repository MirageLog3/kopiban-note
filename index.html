<style>
:root{
  /* 配色: 方眼ノートに青ペンで書き込むイメージ。色だけに頼らず、色の見え方が違う人にも区別しやすい組み合わせにする */
  --bg:#11161d;--panel:#18202a;--panel2:#212b37;--line:#2e3a48;--text:#e8edf3;--sub:#9aa6b4;
  --accent:#6b9cf5;--accent2:#8fb4f7;--accbg:#6b9cf522;--accbg2:#6b9cf544;--ok:#2bb38a;--live:#e8893a;--rec:#e0533d;
  --topbg:#11161dee;--sheetbg:#161d26f5;--hover:#ffffff08;--beat:#364353;--start:#6f7d8d;--muted:#566474;--shadow:#0008;
  --inbg:#0c1117;--inline:#3e4b5a;--btnsh:#00000080;color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f5f7;--panel:#ffffff;--panel2:#e9eef4;--line:#d3dae2;--text:#1b2430;--sub:#5d6977;
  --accent:#1d4ed8;--accent2:#3b67e0;--accbg:#1d4ed814;--accbg2:#1d4ed833;--ok:#0f8a66;--live:#c2410c;--rec:#c2361f;
  --topbg:#f3f5f7ee;--sheetbg:#f8fafcf5;--hover:#0000000a;--beat:#cfd7e0;--start:#8593a3;--muted:#a3aebb;--shadow:#0f172a24;
  --inbg:#ffffff;--inline:#bac4cf;--btnsh:#0f172a1a;color-scheme:light;
}
@media (prefers-color-scheme:light){:root[data-theme=auto]{
  --bg:#f3f5f7;--panel:#ffffff;--panel2:#e9eef4;--line:#d3dae2;--text:#1b2430;--sub:#5d6977;
  --accent:#1d4ed8;--accent2:#3b67e0;--accbg:#1d4ed814;--accbg2:#1d4ed833;--ok:#0f8a66;--live:#c2410c;--rec:#c2361f;
  --topbg:#f3f5f7ee;--sheetbg:#f8fafcf5;--hover:#0000000a;--beat:#cfd7e0;--start:#8593a3;--muted:#a3aebb;--shadow:#0f172a24;
  --inbg:#ffffff;--inline:#bac4cf;--btnsh:#0f172a1a;color-scheme:light;
}}
*{box-sizing:border-box}
html.appscroll,html.appscroll body{height:100%;overflow:hidden}html.appscroll #app{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}

a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:none;border-color:transparent;color:var(--sub)}
button.ghost:hover{color:var(--text)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
/* ボタンと入力欄を見分けられるように: ボタンは少し浮かせ、文字を入れる欄は白(ダークでは黒)でへこませる */
button:not(.ghost):not(.foldbtn):not(.bn):not(.kk){box-shadow:0 1px 2px var(--btnsh)}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]):not([readonly]):not(.name):not(.lyric):not(.nameedit),textarea{background:var(--inbg);border-color:var(--inline);box-shadow:inset 0 1px 2px var(--btnsh)}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]):not([readonly]):focus,textarea:focus{border-color:var(--accent)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
/* ホーム画面のアプリ(特にiPadのウインドウ表示)では、画面の上の端にOSの帯がかぶって、ぼかしがかかる。上のバーの中身はその下から始める */
header.top{padding-top:max(8px,env(safe-area-inset-top))}
/* iPhone・iPadのホーム画面アプリでは、画面の上の端にOSのガラスの効果がかかって文字がにじむ(「透明度を下げる」で消えることで確認)。上のバーの文字をその帯より下に置く */
html.ipadapp header.top{padding-top:36px}
html.ipadapp .drawer-bg{background:linear-gradient(transparent 0 36px,#0007 36px)}html.ipadapp .modal-bg{background:linear-gradient(transparent 0 36px,#0008 36px)}
html.iphoneapp header.top{padding-top:max(22px,calc(env(safe-area-inset-top) + 4px))}

.brand-i{width:22px;height:22px;border-radius:5px;flex:none}

.top nav a.on{color:var(--accent);background:var(--accbg)}
main{max-width:980px;margin:0 auto;padding:20px 20px 260px}
h1{font-size:24px;margin:4px 0 6px}
/* 名前を書きかえられる欄: 下に点線を引いて、押せば変えられると分かるようにする */
input.nameedit{background:none;border:0;border-bottom:1.5px dashed var(--inline);border-radius:0;box-shadow:none}

.addbtn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.adrag-ghost{z-index:80;pointer-events:none;box-shadow:0 8px 24px var(--shadow);opacity:.95}

.studio.live .evnext{background:var(--live)}.evdel{padding:2px 8px;margin-left:4px}.evpast .studio{opacity:.6}
.sec.hstack{gap:6px}.sec.hstack button{font-size:13px;padding:5px 10px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px}
/* ブロック設定: 1行目 種類・小節数 / 2行目 拍子・テンポ・Key / 3行目 メモ / マーカー。項目名は入力欄の上に小さく */
.blockhead.panel{display:flex;flex-direction:column;align-items:stretch;gap:10px}

.cs-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}

.kb{display:flex;flex-direction:column;gap:5px;margin-top:6px}

let DB;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('kopiban',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('blobs')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idb(store,mode,fn){return new Promise((res,rej)=>{const tx=DB.transaction(store,mode);const req=fn(tx.objectStore(store));
  tx.oncomplete=()=>res(req&&req.result);tx.onerror=()=>rej(tx.error)})}

let SFQ='';
const sfNorm=t=>String(t||'').normalize('NFKC').toLowerCase().replace(/[、。,.!?！？「」『』()（）・…〜~-]/g,'').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,'');
function songFindList(){const q=sfNorm(SFQ);if(!q)return '';const hits=[];
  S.songs.forEach(s=>{let why='';if(!sfNorm(s.title).includes(q)){
    const ll=String(s.lyrText||'').split(String.fromCharCode(10)).find(l=>sfNorm(l).includes(q));if(ll)why='歌詞: '+ll.trim().slice(0,40);
    if(!why)for(const b of s.blocks||[]){
      const f=[[b.name,'ブロック'],[b.note,'メモ'],[(b.lyrLines||[]).join(' '),'歌詞'],[(b.bars||[]).map(x=>x.lyric||'').join(' '),'歌詞']].find(([v])=>sfNorm(v).includes(q));if(f){why=(f[1]?f[1]+': ':'')+String(f[0]).replace(/\s+/g,' ').slice(0,40);break}}
      if(!why)return}hits.push({s,why})});
  if(!hits.length)return '<div class="empty">見つかりませんでした</div>';
  return `<div class="list cards">${hits.slice(0,40).map(({s,why})=>`<div class="row"><a class="body" href="#/song/${s.id}"><div class="title">${esc(s.title)}</div><div class="sub">${S.bands.some(b=>b.id===s.bandId)?esc(bandNameOf(s.bandId)):'バンドなし'} ・ ${songMeta(s)}</div>${why?`<div class="sub">${esc(why)}</div>`:''}${strip(s)}</a></div>`).join('')}</div>`}

const memoUrls=t=>[...new Set(String(t||'').match(/https?:\/\/[^\s<>"'「」]+/g)||[])];
const memoLinks=t=>memoUrls(t).map(u=>{let n=u;try{const x=new URL(u);n=x.hostname.replace(/^www\./,'')+(x.pathname.length>1?x.pathname.slice(0,18)+(x.pathname.length>18?'…':''):'')}catch(e){}return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`}).join('');
// バンド・イベントのメモ欄(中身はブロックのメモと同じ)

// 写真ボード: 幅1000の仮想キャンバスに写真を自由に置く。表示は画面幅×拡大率で縮尺する
let BZ=1;
function boardHTML(bl){const photos=bl.memos.filter(m=>m.kind==='photo');
  photos.forEach((m,i)=>{if(m.x==null){m.x=20+(i%2)*500;m.y=20+Math.floor(i/2)*420;m.w=460}});
  return `<div class="board-tools hstack"><span class="sub">ドラッグで移動・右下の ◢ で大きさ・タップで全画面・2本指(PCはCtrl+ホイール)で拡大縮小</span><span class="spacer"></span>
    <button data-act="bZoom" data-v="-1">－</button><span id="bzv" class="sub">${Math.round(BZ*100)}%</span><button data-act="bZoom" data-v="1">＋</button><button data-act="bZoom" data-v="0">全体</button></div>
  <div class="board-wrap" id="boardWrap"><div class="board-sizer" id="boardSizer"><div class="board" id="board">${photos.map(m=>`<div class="bp" data-mid="${m.id}" style="left:${m.x}px;top:${m.y}px;width:${m.w}px">
    <img data-blob="${m.blobId}" draggable="false" alt=""><input class="bp-cap" value="${esc(m.name||'')}" data-input="memoName" data-id="${m.id}" placeholder="説明">
    <span class="bp-rs">◢</span><button class="bp-del" data-act="delMemo" data-id="${m.id}" title="削除">✕</button></div>`).join('')}</div></div></div>`}
function boardH(bl){return Math.max(700,...bl.memos.filter(m=>m.kind==='photo').map(m=>m.y+(m.h||m.w*0.75)+60))}
function layoutBoard(){const w=$('#boardWrap'),b=$('#board'),sz=$('#boardSizer'),bl=memoHost();if(!w||!b||!bl)return;
  const k=w.clientWidth/1000*BZ,H=boardH(bl);b.style.height=H+'px';b.style.transform=`scale(${k})`;sz.style.width=1000*k+'px';sz.style.height=H*k+'px';
  const z=$('#bzv');if(z)z.textContent=Math.round(BZ*100)+'%';
  b.querySelectorAll('.bp img').forEach(img=>{const m=findMemo(img.closest('.bp').dataset.mid).m;
    const fit=()=>{if(img.naturalWidth&&m){const h=Math.round(img.naturalHeight/img.naturalWidth*m.w);if(m.h!==h){m.h=h;save();layoutBoard()}}};
    if(img.complete)fit();else img.onload=fit})}
function setBZ(z){BZ=Math.min(4,Math.max(0.3,z));layoutBoard()}
let BD=null;const bptr=new Map();
document.addEventListener('pointerdown',e=>{const wrap=e.target.closest&&e.target.closest('#boardWrap');if(!wrap)return;
  bptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(bptr.size===2){const [a,b]=[...bptr.values()];BD={pinch:true,d0:Math.hypot(a.x-b.x,a.y-b.y),z0:BZ};return}
  const bp=e.target.closest('.bp');if(!bp||e.target.closest('.bp-del,.bp-cap'))return;
  e.preventDefault();const m=findMemo(bp.dataset.mid).m;const k=wrap.clientWidth/1000*BZ;
  BD={m,el:bp,mode:e.target.closest('.bp-rs')?'rs':'mv',sx:e.clientX,sy:e.clientY,x0:m.x,y0:m.y,w0:m.w,h0:m.h||m.w*0.75,k,moved:0};
  try{bp.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!bptr.has(e.pointerId))return;bptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!BD)return;
  if(BD.pinch){if(bptr.size<2)return;const [a,b]=[...bptr.values()];setBZ(BD.z0*Math.hypot(a.x-b.x,a.y-b.y)/BD.d0);e.preventDefault();return}
  const dx=(e.clientX-BD.sx)/BD.k,dy=(e.clientY-BD.sy)/BD.k;BD.moved=Math.max(BD.moved,Math.abs(dx*BD.k)+Math.abs(dy*BD.k));const m=BD.m;
  if(BD.mode==='mv'){m.x=Math.round(Math.min(1000-m.w*0.3,Math.max(-m.w*0.7,BD.x0+dx)));m.y=Math.round(Math.max(0,BD.y0+dy));BD.el.style.left=m.x+'px';BD.el.style.top=m.y+'px'}
  else{m.w=Math.round(Math.min(1000,Math.max(120,BD.w0+dx)));m.h=Math.round(BD.h0*m.w/BD.w0);BD.el.style.width=m.w+'px'}
  e.preventDefault()},{passive:false});
function endBoard(e){bptr.delete(e.pointerId);if(!BD)return;const d=BD;if(d.pinch){if(bptr.size<2)BD=null;return}BD=null;
  if(d.mode==='mv'&&d.moved<6&&e.type==='pointerup'){const m=d.m;ACT.lb({dataset:{id:m.blobId}});return}
  save();layoutBoard()}
document.addEventListener('pointerup',endBoard);document.addEventListener('pointercancel',endBoard);
document.addEventListener('wheel',e=>{if(!e.ctrlKey||!(e.target.closest&&e.target.closest('#boardWrap')))return;e.preventDefault();setBZ(BZ*(e.deltaY<0?1.1:1/1.1))},{passive:false});
window.addEventListener('resize',()=>layoutBoard());
const stamp=()=>{const d=new Date();return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
async function addMemoBlob(bl,kind,blob,name){const id=uid();await putBlob(id,blob);bl.memos.push({id:uid(),kind,blobId:id,name,ts:Date.now()});save()}
async function handleFiles(files){const bl=memoHost();if(!bl)return;let n=0;

    else if(f.type.startsWith('audio/')||f.type.startsWith('video/')){await addMemoBlob(bl,'audio',f,f.name.replace(/\.\w+$/,''));n++}}

async function toggleRec(){
  if(rec){rec.mr.stop();return}

      await addMemoBlob(bl,'audio',new Blob(chunks,{type:mr.mimeType||'audio/webm'}),'録音 '+stamp());render()};

function findMemo(id){for(const s of S.songs)for(const b of s.blocks){const m=b.memos.find(m=>m.id===id);if(m)return {m,b}}

// 構成表をA4の幅で並べたときの高さを測り、A4 1枚に収まる文字サイズ(px)を前もって決めておく。
// 印刷の瞬間に計算するとiPhoneの最初のプレビューに反映されないので、表示した時点で固定値を入れておく
// 測るときは「印刷の紙幅(703px)の窓」の中で測る。iPadやPCは画面が広くて、画面幅で切り替わるスタイルが印刷時と違ってしまうため
let MEAS_FR=null;

const PRINT_MM=IS_IPAD?195:225;
function measDoc(){if(MEAS_FR&&MEAS_FR.isConnected)return MEAS_FR.contentDocument;const fr=document.createElement('iframe');
  fr.setAttribute('aria-hidden','true');fr.tabIndex=-1;fr.style.cssText='position:absolute;left:-99999px;top:0;width:703px;height:200px;border:0;visibility:hidden';document.body.appendChild(fr);
  const d=fr.contentDocument;d.open();d.write('<!doctype html><html><head><meta charset="utf-8"><style>'+document.querySelector('style').textContent+'</style></head><body style="margin:0"></body></html>');d.close();
  d.documentElement.className=document.documentElement.className;MEAS_FR=fr;return d}
function measureMaps(){const pvs=document.querySelectorAll('.pv.map:not(.measure)');if(!pvs.length)return;const d=measDoc();
  pvs.forEach(pv=>{const c=d.importNode(pv,true);c.classList.add('measure');
  c.style.cssText='width:703px;padding:0;margin:0;font-size:16px;box-shadow:none;max-width:none';d.body.appendChild(c);
  const pem=c.getBoundingClientRect().height/16;c.remove();

    while(p<end){tick+=vlq();let st=d.getUint8(p);if(st<0x80){st=rs}else p++;

        else if(ty===0x59&&l>=2)ev.key.push({tick,sf:(by[0]<<24)>>24,mi:by[1]});

  doImportSong(){const p=PENDING;if(!p)return;const mode=(document.querySelector('input[name=impMode]:checked')||{}).value||'update';

    let bid=band().id;const ob=p.band?p.band.oid:p.bandOid;let tb=ob&&S.bands.find(x=>x.oid===ob||x.id===ob);
    if(!tb&&p.band){tb={id:uid(),name:p.band.name,oid:ob};S.bands.push(tb)}if(tb)bid=tb.id;
    const idMap={},added=[],updated=[];
    p.songs.forEach((s,i)=>{const o=p.oids[i],ex=o&&S.songs.find(x=>x.oid===o||x.id===o);
      if(ex&&mode==='update'){impUpdateSong(ex,s);idMap[i]=ex.id;updated.push(ex)}else{s.bandId=bid;if(o&&!ex)s.oid=o;S.songs.push(s);idMap[i]=s.id;added.push(s)}});
    ensureMarkers(p.songs.flatMap(s=>s.blocks.flatMap(b=>b.tags)));PENDING=null;
    const msg=`${added.length?added.length+'曲を追加':''}${added.length&&updated.length?'、':''}${updated.length?updated.length+'曲を更新':''}しました`;

        sl={id:uid(),bandId:bid,gigId:g.id,name:p.setlist,songIds:p.songs.map((_,i)=>idMap[i]),events:evs.filter(e=>e.type!=='live'),oid:p.slOid||undefined};S.setlists.push(sl)}

    if(SY.meta.on){clearTimeout(SY.t);setTimeout(()=>syncPush(true),300);toast(msg+'。Googleドライブにも保存します')}else toast(msg);
    if(!S.prefs.tutDone)setTimeout(tutOffer,900)},

    if(k==='z'&&!e.shiftKey){e.preventDefault();undo();return}if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();return}}

// ⋮⋮ をつかんで並べ替える(マウス・タッチ共通)。つかんだ行は影をつけて浮かせ、指について動く。
// ほかの行は、つかんだ行が通り過ぎたぶんだけすっと上下にずれて、置く場所を空けて見せる
let pdrag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');const row=h&&h.closest('[data-drag]');if(!row)return;
  e.preventDefault();const k=row.dataset.drag,list=row.parentElement,rows=[...list.children].filter(r=>r.dataset&&r.dataset.drag===k);
  const rc=rows.map(r=>r.getBoundingClientRect()),from=rows.indexOf(row);if(from<0)return;
  // ほかの行がよける幅 = つかんだ行の高さ + 行と行のすき間(カード表示のとき)
  const gap=rc.length>1?Math.max(0,rc[1].top-rc[0].bottom):0;
  pdrag={k,from,to:from,row,rows,list,h:rc[from].height+gap,y0:e.clientY+scrY(),lastY:e.clientY,
    mids:rc.map(r=>r.top+r.height/2+scrY()),minDy:rc[0].top-rc[from].top-rc[from].height/2,maxDy:rc[rc.length-1].bottom-rc[from].bottom+rc[from].height/2};
  list.classList.add('drag-list');document.body.classList.add('dragging-row');
  rows.forEach(r=>{if(r!==row)r.style.transition='transform .18s ease'});row.classList.add('lifting');
  try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
  // 指を画面の端で止めていても、そのままスクロールし続ける
  pdrag.timer=setInterval(()=>{if(!pdrag)return;const y=pdrag.lastY;
    if(y<80)scrBy(0,-Math.ceil((80-y)/6));else if(y>innerHeight-80)scrBy(0,Math.ceil((y-innerHeight+80)/6));pdragMove()},16);
  try{h.setPointerCapture(e.pointerId)}catch(_){}});
function pdragMove(){const d=pdrag;if(!d)return;const dy=Math.max(d.minDy,Math.min(d.maxDy,d.lastY+scrY()-d.y0));
  d.row.style.transform=`translateY(${dy}px) scale(1.02)`;
  const c=d.mids[d.from]+dy;let to=d.from;
  // 端の行とも入れ替えられるよう、行の真ん中に届いた時点で入れ替える(つかんだ行はリストの端から半分はみ出すところまで動かせる)
  d.mids.forEach((m,i)=>{if(i<d.from&&c<=m&&i<to)to=i;if(i>d.from&&c>=m&&i>to)to=i});d.to=to;
  d.rows.forEach((r,i)=>{if(r===d.row)return;const sh=d.from<i&&i<=to?-d.h:to<=i&&i<d.from?d.h:0;r.style.transform=sh?`translateY(${sh}px)`:''})}
document.addEventListener('pointermove',e=>{if(!pdrag)return;e.preventDefault();pdrag.lastY=e.clientY;pdragMove()},{passive:false});
function endPdrag(){if(!pdrag)return;const {k,from,to,rows,row,list,timer}=pdrag;pdrag=null;clearInterval(timer);
  rows.forEach(r=>{r.style.transform='';r.style.transition=''});row.classList.remove('lifting');list.classList.remove('drag-list');document.body.classList.remove('dragging-row');
  if(from!==to){const arr=k==='gb'?gigDragArr():k==='sl'?curSetlist().songIds:curSong().blocks;const [x]=arr.splice(from,1);arr.splice(to,0,x);render()}}
document.addEventListener('pointerup',endPdrag);document.addEventListener('pointercancel',endPdrag);

  drag=null});

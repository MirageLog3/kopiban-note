<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="コピバンノート">
<meta name="theme-color" content="#141312">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>コピバン練習ノート</title>
<style>
:root{
  --bg:#141312;--panel:#1e1c1a;--panel2:#262320;--line:#36322d;--text:#eeeae4;--sub:#9a938a;
  --accent:#ff6a2b;--accent2:#ff8a55;--ok:#2fa58c;
  --topbg:#181715ee;--sheetbg:#1c1a18f5;--hover:#ffffff08;--beat:#3d3933;--start:#6a625a;--muted:#5a534b;--shadow:#0008;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f6f3ee;--panel:#ffffff;--panel2:#f1ede6;--line:#ddd6cc;--text:#24201c;--sub:#7a7268;
  --accent:#ea5a1c;--topbg:#f6f3eeee;--sheetbg:#fbf9f6f5;--hover:#0000000a;--beat:#d6cfc4;--start:#9a9086;--muted:#b3aa9f;--shadow:#0002;
  color-scheme:light;
}
@media (prefers-color-scheme:light){:root[data-theme=auto]{
  --bg:#f6f3ee;--panel:#ffffff;--panel2:#f1ede6;--line:#ddd6cc;--text:#24201c;--sub:#7a7268;
  --accent:#ea5a1c;--topbg:#f6f3eeee;--sheetbg:#fbf9f6f5;--hover:#0000000a;--beat:#d6cfc4;--start:#9a9086;--muted:#b3aa9f;--shadow:#0002;
  color-scheme:light;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:none;border-color:transparent;color:var(--sub)}
button.ghost:hover{color:var(--text)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--topbg);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{font-weight:700}
.bandsel{color:var(--sub);font-size:13px}
.bandsel select{margin-left:4px}
.top nav{margin-left:auto;display:flex;gap:4px}
.top nav a{padding:6px 14px;border-radius:8px;color:var(--sub)}
.top nav a.on{color:var(--accent);background:#ff6a2b1a}
main{max-width:980px;margin:0 auto;padding:20px 20px 260px}
h1{font-size:24px;margin:4px 0 6px}
.back{color:var(--accent);font-size:14px}
.sub{color:var(--sub);font-size:13px}
.hstack{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.studio{border-left:4px solid var(--accent)}
.studio .big{font-size:20px;font-weight:700}
.studio input{font-size:13px}
.sec{display:flex;align-items:center;margin:22px 0 8px;font-weight:700}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--hover)}
.row .num{color:var(--sub);width:18px;text-align:center}
.row .body{flex:1;min-width:0;display:block}
.row .title{font-weight:700}
.row.dragover{box-shadow:inset 0 3px 0 var(--accent)}
.handle{cursor:grab;color:var(--muted);user-select:none}
.strip{display:flex;gap:2px;height:7px;margin-top:7px;border-radius:4px;overflow:hidden}
.strip.big{height:22px;border-radius:6px}
.strip.big div{display:flex;align-items:center;justify-content:center;font-size:10px;color:#000a;font-weight:700;overflow:hidden;white-space:nowrap;cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;margin:6px 4px 0 0}
.tagbtn{font-size:12px;padding:3px 9px;border-radius:6px}
.tagbtn.on{border-color:var(--accent);color:var(--accent);background:#ff6a2b1a}
.deg{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap}
.metro .hstack{gap:8px}.mstat{font-size:13px;color:var(--sub);margin-top:6px;font-variant-numeric:tabular-nums;min-height:1.4em}
.mstat b{color:var(--accent);font-size:15px}
.btitle{display:flex;align-items:center;gap:8px;margin-top:10px}
.btitle .cbar{width:6px;height:34px;flex:0 0 auto}
.btitle .name{flex:1;min-width:0;font-size:20px;font-weight:700;background:none;border-color:transparent;padding:4px 2px}
.btitle .name:focus{border-color:var(--accent)}
.foldbtn{font-size:13px;padding:5px 10px;white-space:nowrap}.foldbtn.on{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:6px 0 0 14px}
.chip{font-size:12px;color:var(--sub);background:var(--panel2);border-radius:10px;padding:2px 8px}
.chips .tag{margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
/* ブロック設定: 1行目 種類・小節数 / 2行目 拍子・テンポ・Key / 3行目 メモ / マーカー。項目名は入力欄の上に小さく */
.blockhead.panel{display:flex;flex-direction:column;align-items:stretch;gap:10px}
.brow{display:grid;gap:8px;align-items:end;max-width:560px}
.brow.b2{grid-template-columns:2fr 1fr}
.brow.b3{grid-template-columns:1.3fr 1fr 1fr}
.brow.b1{grid-template-columns:1fr}
.frow{display:flex;flex-direction:column;gap:3px;min-width:0}
.frow>span{font-size:11px;color:var(--sub)}
.frow>select,.frow>input{width:100%;min-width:0}
.frow.mkrow>span{padding-top:0}
.mkbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sendbtn{width:100%;padding:12px;font-size:16px;margin:4px 0 12px}
.memo-ta{width:100%;resize:vertical;min-height:2.6em;line-height:1.4}
.chip{white-space:pre-line}.mtable .mnote{white-space:pre-line}
/* コード入力パネル */
.cs-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.cs-now{flex:1;min-width:0}
.cs-name{font-size:28px;font-weight:800;line-height:1.15;min-height:1.15em;word-break:break-all}
.cs-empty{font-size:15px;font-weight:400;color:var(--sub)}
.cs-desc{font-size:12px;color:var(--sub);min-height:1.3em}.cs-desc b{color:var(--accent)}
.cs-nav{display:flex;gap:6px;align-items:center}.cs-nav button{padding:8px 12px}
.cs-lab{font-size:12px;color:var(--sub);margin:8px 0 2px}.cs-lab .hl{color:var(--accent)}
.keys.presets.dim{opacity:.45}
.keys .acc{min-width:46px}
.cs-more{width:100%;margin-top:8px;font-size:13px;text-align:left;background:none;border-style:dashed}
.cs-foot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cs-foot #chordIn{width:200px;font-size:16px;padding:6px 8px}
.cs-foot .steps{margin-left:auto}
@media (pointer:coarse){.cs-foot #chordIn{display:none}}
.calopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:12px 14px;margin-top:8px;font-size:15px}
.calopt span{font-size:12px;color:var(--sub)}
.sh-lab{margin-top:8px}.sh-row{flex-wrap:nowrap}.sh-row input{min-width:0}
.toolrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.toolrow .mstat{margin:0}
.metro.closed{display:flex;align-items:center;gap:10px;padding:8px 12px}.metro.closed .mstat{margin:0}
.panel.metro-b{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.shortbox{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.shortcode{flex:1;min-width:0;width:100%;font-size:26px!important;font-weight:800;letter-spacing:4px;text-align:center;font-family:ui-monospace,Consolas,monospace}
.pl-mini{display:none;align-items:center;gap:8px;flex:1;min-width:0}
.pm-play{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;background:var(--accent);border-color:var(--accent);color:#fff;flex:0 0 auto}
#pmSeek{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.pm-time{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.pm-more{font-size:20px;padding:4px 8px}
.msync{margin-top:8px;gap:6px}.msync button{padding:3px 7px;font-size:12px}
.metro-b{margin-top:10px;gap:6px}.metro-b .mstat{margin:0}
#ytWrap iframe{display:block;border-radius:6px;width:240px;height:135px}
@media screen and (max-width:700px){#ytWrap iframe{width:160px;height:90px}}
.board-tools{margin-bottom:6px;gap:6px}.board-tools button{padding:3px 10px}
.board-wrap{position:relative;overflow:auto;border-radius:10px;background:var(--panel);border:1px solid var(--line);max-height:80vh}
.board-sizer{position:relative}
.board{position:absolute;left:0;top:0;width:1000px;transform-origin:0 0;background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:40px 40px}
.bp{position:absolute;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.bp img{width:100%;display:block;border-radius:6px;box-shadow:0 4px 16px var(--shadow);background:#fff;pointer-events:none}
.bp-cap{position:absolute;left:0;right:0;top:100%;margin-top:4px;font-size:22px;background:transparent;border:none;color:var(--sub);padding:2px 4px}
.bp-rs{position:absolute;right:-6px;bottom:-6px;width:44px;height:44px;display:flex;align-items:flex-end;justify-content:flex-end;font-size:28px;color:var(--accent);cursor:nwse-resize}
.bp-del{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;opacity:.8}
.row.mplaying{box-shadow:inset 4px 0 0 var(--accent);background:#ff6a2b10}
.bar.mbar .cells{outline:2px solid var(--accent);outline-offset:1px}
.legend.hstack{gap:8px}
.mk input[type=color]{width:38px;height:32px;padding:2px}
.cbar{width:5px;align-self:stretch;border-radius:3px}
.meta input{width:90px}
.meta label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.adds button{font-size:13px}
.empty{color:var(--sub);text-align:center;padding:40px}
.counts{color:var(--sub);font-size:12px;white-space:nowrap}
.rowbtns{display:flex;gap:2px;opacity:.35}
.row:hover .rowbtns{opacity:1}
.rowbtns button{padding:3px 7px;font-size:12px}
/* block */
.blockhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blockhead .name{font-size:20px;font-weight:700;width:180px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin:14px 0}
.tabs a{flex:1;text-align:center;padding:7px;border-radius:7px;color:var(--sub)}
.tabs a.on{background:var(--panel2);color:var(--text);font-weight:700}
.legend{color:var(--sub);font-size:12px;margin-bottom:8px}
.bar{display:grid;grid-template-columns:34px 1fr;column-gap:6px;margin-bottom:6px}
.bn{background:none;border:none;color:var(--sub);padding:0;font-size:13px;text-align:right;line-height:1.1}
.bn small{display:block;font-size:10px;color:var(--accent)}
.cells{display:grid;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:36px;overflow:hidden}
.cell{padding:8px 4px 8px 6px;font-size:14px;font-weight:600;white-space:nowrap;overflow:visible;cursor:pointer;position:relative;min-width:0}
.cell.beat::before{content:"";position:absolute;left:0;top:30%;bottom:30%;border-left:1px dotted var(--beat)}
.cell.start::before{top:0;bottom:0;border-left:2px solid var(--start)}
.cell.first::before{display:none}
.cell:hover{background:var(--hover)}
.cell.sel{background:var(--accent);color:#fff}
.lyric{grid-column:2;margin-top:3px;background:none;border:none;border-bottom:1px dashed transparent;border-radius:0;padding:2px 4px;font-size:13px;color:var(--sub)}
.lyric:hover,.lyric:focus{border-bottom-color:var(--line)}
/* sheet */
#sheet .sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheetbg);border-top:1px solid var(--line);box-shadow:0 -10px 30px var(--shadow);padding:12px 20px 16px;backdrop-filter:blur(8px)}
.sheet-in{max-width:980px;margin:0 auto}
.sh-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.pos{color:var(--sub);font-size:12px}
#chordIn{font-size:24px;font-weight:700;width:220px;padding:4px 10px}
.steps{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.steps button{padding:3px 8px;font-size:12px}
.steps button.on,.keys button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.keys{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.keys button{min-width:52px;padding:7px 8px;font-weight:600}
.keys.roots button{min-width:64px;font-size:17px}
.qrow{align-items:center}.qlab{font-size:11px;color:var(--sub);width:58px;flex:0 0 auto}
.kbd{font-size:11px;color:var(--sub);margin-left:auto}
/* memo */
.memobar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;margin-top:12px;min-height:120px}
.drop.over{border-color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.photo{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.photo img{width:100%;height:180px;object-fit:cover;display:block;cursor:zoom-in;background:#000}
.photo .cap{display:flex;gap:4px;padding:6px}
.photo .cap input{flex:1;min-width:0;font-size:12px}
.memo-item{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.memo-item audio{flex:1;height:34px}
.memo-item input{width:220px}
.memo-item textarea{flex:1;min-height:60px;resize:vertical}
.rec{background:#c0392b;border-color:#c0392b;color:#fff;font-weight:700}
.lb{position:fixed;inset:0;z-index:50;background:#000e;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lb img{max-width:96vw;max-height:96vh;cursor:zoom-in}
.lb.zoom{display:block}
.lb.zoom img{max-width:none;max-height:none;width:200%;cursor:zoom-out}
.lbx{position:fixed;top:14px;right:18px;z-index:51;font-size:20px}
.note{font-size:13px;color:var(--sub);line-height:1.7}
.themebtn{padding:5px 10px}
/* print / PDF */
.pv{background:#fff;color:#1a1a1a;max-width:860px;margin:16px auto;padding:32px 36px;border-radius:8px;box-shadow:0 4px 20px var(--shadow)}
.pv h1{font-size:22px;margin:0 0 2px}
.pv .pmeta{color:#555;font-size:12px}
.pv .strip.big div{color:#0009}
.pblk{break-inside:avoid;page-break-inside:avoid;margin-top:16px}
.pblk-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;border-bottom:1px solid #ccc;padding-bottom:3px;margin-bottom:6px}
.pblk-h .pc{width:10px;height:14px;border-radius:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pblk-h .ps{font-weight:400;color:#666;font-size:12px}
.ptag{font-size:10px;border:1px solid #c44a14;color:#c44a14;border-radius:3px;padding:0 4px;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:4px}
.pbar{display:grid;grid-template-columns:18px 1fr;column-gap:4px}
.pbar .pn{font-size:10px;color:#888;text-align:right;padding-top:3px}
.pcells{display:grid;border:1px solid #bbb;border-radius:3px;min-height:22px}
.pcell{font-size:12px;font-weight:700;padding:3px 2px 3px 3px;white-space:nowrap;position:relative}
.pcell.start:not(.first)::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid #777}
.plyr{grid-column:2;font-size:10px;color:#444;min-height:12px}
.pnotes{font-size:11px;color:#333;margin-top:4px;white-space:pre-wrap}
.pphotos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pphotos img{max-height:160px;max-width:48%;border:1px solid #ccc}
.pbar-actions{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ptabs{display:inline-flex;margin-left:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.ptabs a{padding:4px 12px;border-radius:6px;color:var(--sub);font-size:13px}
.ptabs a.on{background:var(--panel2);color:var(--text);font-weight:700}
.pv.map{font-size:16px}
.map h1{font-size:1.75em;margin:0 0 .1em}
.map .pmeta{font-size:.75em}
.map .strip.big{height:1.75em}
.map .strip.big div{font-size:.75em}
.mtable{width:100%;border-collapse:collapse}
.mtable td{border-bottom:1px solid #ddd;padding:.8em .5em;vertical-align:middle;line-height:1.35}
.mtable .mi{width:1.4em;color:#999;font-size:.75em;text-align:right}
.mtable .mc{width:.5em;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.mtable .mn{font-size:1.25em;font-weight:700;white-space:nowrap;padding-left:.5em}
.mtable .mb{white-space:nowrap;text-align:right;width:4.4em}
.mtable .mb b{font-size:1.4em}.mtable .mb span{font-size:.7em;color:#666;margin-left:2px}
.mtable .mx{padding-left:1em}
.mtable .mnote{font-size:.95em;font-weight:600;display:inline;margin-right:.5em;vertical-align:middle}
.mtable .mmemo{font-size:.75em;color:#444;margin-top:.3em;line-height:1.5}
.mtable .ptag{display:inline-block;margin:0 .25em 0 0;vertical-align:middle;font-size:.7em;padding:.1em .35em}
.mtable .mp{width:4em;text-align:right;font-size:.7em;color:#999;white-space:nowrap}

@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  .top,.noprint,#sheet,#player{display:none!important}
  main{padding:0!important;max-width:none}
  .pv{box-shadow:none;margin:0;padding:0;max-width:none}
  .pv.map{font-size:var(--pfs,16px)}
  .pv+.pv{break-before:page;page-break-before:always}
  .strip,.strip div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#player{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheetbg);border-top:1px solid var(--line);padding:8px 20px;backdrop-filter:blur(8px)}
.pl-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pl-name{font-weight:700;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pa{flex:1;min-width:260px;height:36px}
body.has-player #sheet .sheet{bottom:54px}
.row.playing{background:#ff6a2b18}.row.playing .title{color:var(--accent)}
.tbtns{display:flex;gap:4px;align-items:center}
.tbtns button{padding:3px 8px;font-size:12px}
.tbtns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtns button:disabled{opacity:.35;cursor:default}
.tstamp{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.modal-bg{position:fixed;inset:0;background:#0008;z-index:40}
.modal{position:fixed;left:50%;top:12%;transform:translateX(-50%);width:min(640px,92vw);z-index:41;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 20px 50px var(--shadow)}
.modal input{font-size:12px}
.brand,.top nav a,.themebtn{white-space:nowrap}
@media screen and (max-width:700px){
  .top{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}
  .brand{font-size:14px}
  .top nav{margin-left:0}
  .top nav a{padding:4px 8px}
  main{padding:12px 12px 260px}
  .pv{padding:18px 14px;margin:10px 0}

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="player" style="display:none"></div>
<div id="overlay"></div>
<input type="file" id="filePick" multiple hidden>
<input type="file" id="importPick" accept=".json,application/json" hidden>
<script>
'use strict';
const TYPES={
  In:{label:'イントロ',short:'In',color:'#77716a'},
  A:{label:'Aメロ',short:'A',color:'#2fa58c'},
  B:{label:'Bメロ',short:'B',color:'#7c7fd6'},
  S:{label:'サビ',short:'サビ',color:'#e0b13a'},
  I:{label:'間奏',short:'間',color:'#a57fd0'},
  C:{label:'Cメロ',short:'C',color:'#4a8fd6'},
  D:{label:'大サビ',short:'大',color:'#f08c2a'},
  Out:{label:'アウトロ',short:'Out',color:'#77716a'},
  X:{label:'その他',short:'他',color:'#5d5852'},
};
const DEFAULT_MARKERS=[['キメ','#ff6a2b'],['拍子変化','#7c7fd6'],['転調','#2fa58c'],['テンポ注意','#e0b13a'],['合いの手','#4a8fd6'],['未確定','#9a938a']];
const markerColor=n=>((S.markers||[]).find(m=>m.name===n)||{color:'#9a938a'}).color;
const tagHTML=(t,cls='tag')=>`<span class="${cls}" style="border-color:${markerColor(t)};color:${markerColor(t)}">${esc(t)}</span>`;
function ensureMarkers(names){names.forEach(n=>{if(n&&!S.markers.some(m=>m.name===n))S.markers.push({name:n,color:'#9a938a'})})}
// ディグリー表示: Keyの主音から見た度数(ローマ数字)に置き換えて表示する
const PCN={C:0,D:2,E:4,F:5,G:7,A:9,B:11},ACC={'b':-1,'♭':-1,'#':1,'♯':1};
const ROMAN=['Ⅰ','♭Ⅱ','Ⅱ','♭Ⅲ','Ⅲ','Ⅳ','♯Ⅳ','Ⅴ','♭Ⅵ','Ⅵ','♭Ⅶ','Ⅶ'];
function keyTonic(k){const m=String(k||'').trim().match(/^([A-G])([b#♭♯]?)/);return m?(PCN[m[1]]+(ACC[m[2]]||0)+12)%12:null}
function toDegree(c,tonic){if(tonic==null||!c)return c;let tie='';if(c.startsWith('⌒')){tie='⌒';c=c.slice(1)}
  const m=c.match(/^([A-G])([b#♭♯]?)(.*?)(?:\/([A-G])([b#♭♯]?))?$/);if(!m)return tie+c;
  const d=(r,a)=>ROMAN[(PCN[r]+(ACC[a]||0)-tonic+24)%12];return tie+d(m[1],m[2])+m[3]+(m[4]?'/'+d(m[4],m[5]):'')}
const blockKey=(bl,s)=>(bl&&bl.key)||(s&&s.key)||'';
const showC=(c,bl)=>S.prefs.degree?toDegree(c,keyTonic(blockKey(bl,curSong()))):c;
const TOUCH=matchMedia('(pointer:coarse)').matches;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

/* ---------- storage (IndexedDB) ---------- */
let DB;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('kopiban',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('blobs')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idb(store,mode,fn){return new Promise((res,rej)=>{const tx=DB.transaction(store,mode);const req=fn(tx.objectStore(store));
  tx.oncomplete=()=>res(req&&req.result);tx.onerror=()=>rej(tx.error)})}
const putBlob=(id,b)=>idb('blobs','readwrite',s=>s.put(b,id));
const getBlob=id=>idb('blobs','readonly',s=>s.get(id));
const delBlob=id=>idb('blobs','readwrite',s=>s.delete(id));
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>idb('kv','readwrite',s=>s.put(S,'state')),250)}
window.addEventListener('beforeunload',()=>{if(saveT){clearTimeout(saveT);idb('kv','readwrite',s=>s.put(S,'state'))}});
const urlCache={};
async function blobURL(id){if(!urlCache[id]){const b=await getBlob(id);if(!b)return '';urlCache[id]=URL.createObjectURL(b)}return urlCache[id]}

/* ---------- model ---------- */
let S;
const newBar=(n=8)=>({n,cells:Array(n).fill(''),lyric:''});
function newBlock(type,name,bars){bars=bars??(type==='In'||type==='Out'?4:8);
  return {id:uid(),type,name:name||TYPES[type].label,bars:Array.from({length:bars},()=>newBar()),tags:[],note:'',memos:[]}}
function newSong(bandId,title){return {id:uid(),bandId,title,bpm:'',meter:'4/4',key:'',url:'',
  blocks:[newBlock('In'),newBlock('A'),newBlock('B'),newBlock('S'),newBlock('Out')]}}
function defaultState(){const b={id:uid(),name:'マイバンド'};const song=newSong(b.id,'サンプル曲');
  const sl={id:uid(),bandId:b.id,name:'次のライブ',songIds:[song.id],studio:{date:'',start:'',end:'',place:''}};
  return {v:1,bands:[b],songs:[song],setlists:[sl],cur:{band:b.id,setlist:sl.id},prefs:{step:2}}}
const band=()=>S.bands.find(b=>b.id===S.cur.band)||S.bands[0];
const songById=id=>S.songs.find(s=>s.id===id);
const bandSongs=()=>S.songs.filter(s=>s.bandId===band().id);
const bandSetlists=()=>S.setlists.filter(x=>x.bandId===band().id);
const totalBars=song=>song.blocks.reduce((a,b)=>a+b.bars.length,0);
function tagCounts(song){const c={};song.blocks.forEach(b=>b.tags.forEach(t=>c[t]=(c[t]||0)+1));return c}
function memoBlobIds(blocks){return blocks.flatMap(b=>b.memos.filter(m=>m.blobId).map(m=>m.blobId))}
function songBlobIds(songs){return [...memoBlobIds(songs.flatMap(s=>s.blocks)),...songs.filter(s=>s.audio).map(s=>s.audio.blobId)]}

/* ---------- route ---------- */
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');return {name:p[0]||'setlist',a:p[1],b:p[2],c:p[3]}}
let R={};
let P=null;   // chord picker state
let rec=null; // recorder

function render(){
  R=route();let html='';
  if(MT.playing&&!((R.name==='song'||R.name==='block')&&R.a===MT.songId))mStop();
  document.documentElement.dataset.theme=S.prefs.theme||'auto';
  if(R.name==='song')html=viewSong();
  else if(R.name==='print')html=viewPrint();
  else if(R.name==='import'||R.name==='s')html=viewImport();
  else if(R.name==='block')html=viewBlock();
  else if(R.name==='songs')html=viewSongs();
  else if(R.name==='settings')html=viewSettings();
  else html=viewSetlist();
  $('#app').innerHTML=html;
  renderSheet();
  syncPlayer();
  if(R.name==='import'||R.name==='s')fillImport();
  measureMaps();
  document.querySelectorAll('[data-blob]').forEach(async el=>{el.src=await blobURL(el.dataset.blob);if(el.closest('#board'))layoutBoard()});
  layoutBoard();
  save();
}
function topbar(tab){
  const opts=S.bands.map(b=>`<option value="${b.id}" ${b.id===band().id?'selected':''}>${esc(b.name)}</option>`).join('');
  return `<header class="top"><div class="brand">🎸<span class="brand-t"> コピバン練習ノート</span></div>
  <label class="bandsel">バンド<select data-change="band">${opts}<option value="__new">＋ 新しいバンド</option></select></label>
  <nav><a href="#/" class="${tab==='setlist'?'on':''}">セトリ</a><a href="#/songs" class="${tab==='songs'?'on':''}">曲</a><a href="#/settings" class="${tab==='settings'?'on':''}">設定</a></nav>
  <button class="ghost themebtn" data-act="cycleTheme" title="表示テーマ(自動/ライト/ダーク)">${THEMES[S.prefs.theme||'auto'].replace(/ (.+)/,'<span class="th-t"> $1</span>')}</button></header>`}
const THEMES={auto:'◐ 自動',light:'☀ ライト',dark:'☾ ダーク'};

function strip(song,big){
  return `<div class="strip ${big?'big':''}">${song.blocks.map(b=>`<div style="flex:${b.bars.length};background:${TYPES[b.type].color}" ${big?`data-act="goBlock" data-id="${b.id}" title="${esc(b.name)}"`:''}>${big?esc(TYPES[b.type].short):''}</div>`).join('')}</div>`}
function tagChips(song){const c=tagCounts(song);return S.markers.filter(m=>c[m.name]).map(m=>`<span class="tag" style="border-color:${m.color};color:${m.color}">${esc(m.name)} ${c[m.name]}</span>`).join('')}
function songMeta(s){return [s.bpm&&'♩'+esc(s.bpm),esc(s.meter),s.key&&'Key '+esc(s.key),totalBars(s)+'小節'].filter(Boolean).join(' ・ ')}

/* ---------- views ---------- */
function daysLeft(d){if(!d)return '';const t=new Date(d+'T00:00');const n=new Date();n.setHours(0,0,0,0);const x=Math.round((t-n)/864e5);
  return x>0?`あと${x}日`:x===0?'今日':'終了'}
function timeSel(k,v){const [h,m]=(v||'').split(':');
  const hs=['<option value="">--</option>',...Array.from({length:24},(_,i)=>{const x=String(i).padStart(2,'0');return `<option ${x===h?'selected':''}>${x}</option>`})].join('');
  const ms=Array.from({length:12},(_,i)=>{const x=String(i*5).padStart(2,'0');return `<option ${x===(m||'00')?'selected':''}>${x}</option>`}).join('');
  return `<span class="tsel"><select data-change="studioTime" data-k="${k}" data-p="h">${hs}</select>:<select data-change="studioTime" data-k="${k}" data-p="m">${ms}</select></span>`}
function studioSum(st){if(!st.date)return '<span class="sub">未設定</span>';const wd='日月火水木金土'[new Date(st.date+'T00:00').getDay()];
  return `${st.date.slice(5).replace('-','/')}(${wd}) ${esc(st.start)}${st.end?'–'+esc(st.end):''} <span class="sub" style="font-size:14px">${esc(st.place)}</span>`}
// スタジオ予定をカレンダーへ(.ics か Googleカレンダー)。通知はカレンダー側のアラームに任せる
const ymd=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0');
function studioEvent(sl){const st=sl.studio||{};if(!st.date)return null;const day=new Date(st.date+'T00:00'),d=ymd(day);
  const title=`${band().name} スタジオ(${sl.name})`;let start,end;const allDay=!st.start;
  if(allDay){const n=new Date(day);n.setDate(n.getDate()+1);start=d;end=ymd(n)}
  else{const [h,m]=st.start.split(':').map(Number);let e=st.end;if(!e){const t=h*60+m+120;e=String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
    const n=new Date(day);if(e<=st.start)n.setDate(n.getDate()+1);start=d+'T'+st.start.replace(':','')+'00';end=ymd(n)+'T'+e.replace(':','')+'00'}
  const songs=sl.songIds.map(songById).filter(Boolean).map((s,i)=>`${i+1}. ${s.title}`).join('\n');
  return {title,start,end,allDay,place:st.place||'',desc:songs?'セトリ\n'+songs:''}}
function buildIcs(ev,uidv){const e=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const dt=(k,v)=>ev.allDay?`${k};VALUE=DATE:${v}`:`${k}:${v}`;
  const alarm=t=>['BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:'+t,'DESCRIPTION:'+e(ev.title),'END:VALARM'];
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kopiban-note//JP','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uidv+'@kopiban-note','DTSTAMP:'+now,
    dt('DTSTART',ev.start),dt('DTEND',ev.end),'SUMMARY:'+e(ev.title),ev.place?'LOCATION:'+e(ev.place):null,ev.desc?'DESCRIPTION:'+e(ev.desc):null,
    ...alarm('-P1D'),...(ev.allDay?[]:alarm('-PT1H')),'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n')}
function viewSetlist(){
  const sls=bandSetlists();
  let sl=sls.find(x=>x.id===R.a)||sls.find(x=>x.id===S.cur.setlist)||sls[0];
  if(!sl)return topbar('setlist')+`<main><div class="empty">このバンドにはまだセトリがありません<br><br><button class="primary" data-act="newSetlist">＋ セトリを作る</button></div></main>`;
  S.cur.setlist=sl.id;
  const st=sl.studio||(sl.studio={date:'',start:'',end:'',place:''});
  const wd=st.date?'日月火水木金土'[new Date(st.date+'T00:00').getDay()]:'';
  const songs=sl.songIds.map(songById).filter(Boolean);
  const others=bandSongs().filter(s=>!sl.songIds.includes(s.id));
  return topbar('setlist')+`<main>
  <div class="hstack"><select data-change="pickSetlist">${sls.map(x=>`<option value="${x.id}" ${x.id===sl.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <button class="ghost" data-act="renameSetlist">名前を変更</button><span class="spacer"></span><button data-act="shareSetlist">🔗 セトリを共有</button>
    <button data-act="newSetlist">＋ セトリ</button><button class="ghost" data-act="delSetlist">削除</button></div>
  <h1>${esc(sl.name)}</h1>
  <div class="card studio"><div class="hstack"><span class="sub">次のスタジオ</span><span class="spacer"></span><b id="stDays">${daysLeft(st.date)}</b></div>
    <div class="big" id="stSum">${studioSum(st)}</div>
    <div class="stin"><label>日付<input type="date" value="${esc(st.date)}" data-input="studio" data-k="date"></label>
      <label>開始${timeSel('start',st.start)}</label><label>終了${timeSel('end',st.end)}</label>
      <label class="stplace">場所<input placeholder="例 いつものスタジオ" value="${esc(st.place)}" data-input="studio" data-k="place"></label></div>
    <div class="hstack" style="margin-top:10px"><button data-act="calMenu">📅 カレンダーに追加・予定を送る</button></div></div>
  <div class="sec">曲 (${songs.length})</div>
  <div class="list">${songs.map((s,i)=>`<div class="row" data-drag="sl" data-idx="${i}">
      <span class="handle">⋮⋮</span><span class="num">${i+1}</span>
      <a class="body" href="#/song/${s.id}"><div class="title">${esc(s.title)}</div><div class="sub">${songMeta(s)}</div>${strip(s)}${tagChips(s)}</a>
      <div class="rowbtns"><button data-act="slRemove" data-i="${i}" title="セトリから外す(曲は消えません)">外す</button></div></div>`).join('')||'<div class="empty">まだ曲がありません</div>'}</div>
  <div class="adds"><button class="primary" data-act="newSongToSetlist">＋ 新しい曲</button>
    ${others.length?`<select data-change="addExisting"><option value="">既存の曲を追加…</option>${others.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select>`:''}</div>
  </main>`}

function viewSongs(){
  const songs=bandSongs();
  return topbar('songs')+`<main><h1>${esc(band().name)} の曲</h1><p class="sub">同じ曲を複数のセトリに入れても、中身は1つなので直せば全部に反映されます。</p>
  <div class="list">${songs.map(s=>{const n=bandSetlists().filter(x=>x.songIds.includes(s.id)).length;
    return `<div class="row"><a class="body" href="#/song/${s.id}"><div class="title">${esc(s.title)}</div><div class="sub">${songMeta(s)} ・ セトリ${n}件</div>${strip(s)}${tagChips(s)}</a>
    <div class="rowbtns"><button data-act="delSong" data-id="${s.id}">削除</button></div></div>`}).join('')||'<div class="empty">まだ曲がありません</div>'}</div>
  <div class="adds"><button class="primary" data-act="newSong">＋ 新しい曲</button></div></main>`}

function viewSong(){
  const s=songById(R.a);if(!s)return topbar('')+`<main><div class="empty">曲が見つかりません</div></main>`;
  const sl=S.setlists.find(x=>x.id===S.cur.setlist);
  const counts={};s.blocks.forEach(b=>counts[b.type]=(counts[b.type]||0));
  return topbar('')+`<main>
  <a class="back" href="#/setlist/${sl?sl.id:''}">‹ ${sl?esc(sl.name):'セトリ'}</a>
  <input class="name" style="display:block;font-size:24px;font-weight:700;background:none;border-color:transparent;padding:4px 0;width:100%" value="${esc(s.title)}" data-input="songField" data-k="title">
  <div class="hstack meta">

/* ---------- metronome (ブロックごとのテンポ・拍子に合わせて鳴らす) ---------- */
const MT={ctx:null,timer:null,raf:null,playing:false,songId:null,loop:null,pre:[],pass:null,preDur:0,i:0,start:0,vis:[]};
const blockBpm=(b,s)=>+b.bpm||+s.bpm||120;
function barBeats(bl,bar,s){const m=normMeter(barMeter(bl,bar,s)||blockMeter(bl,s)).match(/^(\d+)\/(\d+)$/);return m?{n:+m[1],d:+m[2]}:{n:4,d:4}}
function clicksFor(s,blocks,barsOf){const ev=[];let t=0;const rate=S.prefs.mRate||1;
  for(const bl of blocks)for(const bi of barsOf(bl)){const bar=bl.bars[bi];const {n,d}=barBeats(bl,bar,s);const dur=60/(blockBpm(bl,s)*rate)*4/d;
    for(let k=0;k<n;k++){ev.push({t,acc:k===0?2:(d===8&&n%3===0&&k%3===0)?1:0,bid:bl.id,bar:bi,beat:k+1});t+=dur}}
  return {ev,total:t}}
function metroOpts(){const r=S.prefs.mRate||1;
  return `<label class="sub">速さ <select data-change="mRate">${[50,60,70,75,80,90,100,110,120].map(v=>`<option value="${v/100}" ${Math.abs(r-v/100)<.001?'selected':''}>${v}%</option>`).join('')}</select></label>
  <label class="sub"><input type="checkbox" data-change="mCount" ${S.prefs.mCount!==false?'checked':''}> カウント1小節</label>`}
const UI=k=>!!(S.prefs.ui||{})[k];
function metroCard(s){const noBpm=!s.bpm&&!s.blocks.some(b=>b.bpm);const open=UI('smetro');
  if(!open)return `<div class="card metro closed"><button class="foldbtn" data-act="uiToggle" data-k="smetro">🥁 メトロノーム ▸</button><span class="mstat" id="metroStat">${s.mSync&&songMedia(s)?'音源に合わせて鳴らす設定になっています':''}</span></div>`;
  return `<div class="card metro"><div class="hstack"><button class="foldbtn" data-act="uiToggle" data-k="smetro">🥁 メトロノーム ▾</button>
    <select id="mFrom">${s.blocks.map((b,i)=>`<option value="${i}">${i?esc(b.name)+'から':'曲の頭から'}</option>`).join('')}</select>
    <button class="primary" data-act="mPlay">▶ 再生</button><button data-act="mStop">■ 止める</button>${metroOpts()}</div>
    ${songMedia(s)?`<div class="hstack msync"><label class="sub"><input type="checkbox" data-change="mSync" ${s.mSync?'checked':''}> 🎵 音源に合わせて鳴らす</label>
      ${s.mSync?`<span class="sub">1小節目の位置</span><button data-act="mOff" data-v="-0.1">-0.1</button><button data-act="mOff" data-v="-0.01">-0.01</button>
      <input type="number" step="0.01" inputmode="decimal" id="mOffIn" value="${(+s.mOffset||0).toFixed(2)}" data-change="mOffset" style="width:84px"><span class="sub">秒</span>
      <button data-act="mOff" data-v="0.01">+0.01</button><button data-act="mOff" data-v="0.1">+0.1</button>
      <button data-act="mOffNow" title="再生中の位置を1小節目にする">⏱ 今の位置を1小節目に</button>`:''}</div>`:''}
    <div class="mstat" id="metroStat">${s.mSync&&songMedia(s)?'音源の「1小節目の位置」だけ合わせれば、あとは曲のテンポと拍子どおりに刻みます(ブロックの頭では合わせ直しません)。クリックが早ければ＋、遅ければ－'
      :noBpm?'テンポが未入力なので ♩120 で鳴らします。曲かブロックのテンポを入れてください':'ブロックごとのテンポ・拍子に合わせて鳴ります'}</div></div>`}
// 音源同期: 「1小節目の位置」から、曲の構成(テンポ・拍子・小節数)だけで拍の時刻を並べる。ブロックの頭では合わせ直さない
const MS={ev:null,evKey:'',last:null,lastMt:null};
function syncEvents(s){const off=+s.mOffset||0;const ev=[];let t=off;
  s.blocks.forEach(bl=>bl.bars.forEach((bar,bi)=>{const {n,d}=barBeats(bl,bar,s);const dur=60/blockBpm(bl,s)*4/d;
    for(let k=0;k<n;k++){ev.push({t,acc:k===0?2:(d===8&&n%3===0&&k%3===0)?1:0,bid:bl.id,bar:bi,beat:k+1});t+=dur}}));
  return ev}
function syncEv(s){const key=s.id+JSON.stringify(s.blocks.map(b=>[b.id,b.bpm,b.meter,b.bars.map(x=>x.n+(x.m||''))]))+s.bpm+s.meter+s.mOffset;
  if(!MS.ev||MS.evKey!==key){MS.ev=syncEvents(s);MS.evKey=key}return MS.ev}
const syncOn=s=>!!(s&&s.mSync&&songMedia(s));
// ブロックの頭の時刻: 同期モードなら拍の並びから計算、それ以外は ⏱ で登録した位置
function blockTime(s,b){if(syncOn(s)){const e=syncEv(s).find(x=>x.bid===b.id);return e?e.t:null}return b.start}
function ensureCtx(){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;MT.ctx=MT.ctx||new Ctx();if(MT.ctx.state!=='running')MT.ctx.resume();return MT.ctx}
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{if(MT.ctx&&MT.ctx.state!=='running')MT.ctx.resume()},true));
function mediaRate(){try{return M.kind==='yt'?(M.yt.getPlaybackRate()||1):($('#pa').playbackRate||1)}catch(_){return 1}}
function syncTick(){const s=playerSong();
  if(!s||!s.mSync||!M.kind||MT.playing||$('#player').style.display==='none'||M.paused()){if(MS.last!=null&&!MT.playing){MS.last=null;mPaint(null)}return}
  const ctx=ensureCtx();if(!ctx||ctx.state!=='running')return;
  syncEv(s);const mt=M.time(),pr=mediaRate();
  if(MS.last==null||mt<MS.lastMt-0.05||mt>MS.lastMt+0.6)MS.last=mt-0.001;
  MS.lastMt=mt;const horizon=mt+0.12*pr;let cur=null;
  for(const e of MS.ev){if(e.t<=mt)cur=e;if(e.t<=MS.last)continue;if(e.t>horizon)break;clickAt(ctx.currentTime+Math.max(0,(e.t-mt)/pr),e.acc)}

setInterval(syncTick,20);
function syncPlayFrom(s,i){const t=blockTime(s,s.blocks[i]);ensureCtx();M.seek(Math.max(0,(t||0)-0.05));M.play()}
function clickAt(at,acc){const c=MT.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.value=acc===2?1600:acc===1?1200:880;
  g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(acc?0.9:0.5,at+0.002);g.gain.exponentialRampToValueAtTime(0.0001,at+0.06);
  o.connect(g).connect(c.destination);o.start(at);o.stop(at+0.07)}
function mNext(){if(MT.i<MT.pre.length){const e=MT.pre[MT.i];return Object.assign({},e,{at:MT.start+e.t,count:true})}
  const j=MT.i-MT.pre.length,L=MT.pass.ev.length,cyc=Math.floor(j/L);if(cyc>0&&!MT.loop)return null;
  const e=MT.pass.ev[j%L];return Object.assign({},e,{at:MT.start+MT.preDur+cyc*MT.pass.total+e.t})}
function mStart(s,blocks,loopId){mStop();const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return toast('このブラウザでは鳴らせません');
  MT.ctx=MT.ctx||new Ctx();MT.ctx.resume();
  MT.pass=clicksFor(s,blocks,bl=>bl.bars.map((_,i)=>i));if(!MT.pass.ev.length)return;
  const pre=S.prefs.mCount!==false?clicksFor(s,[blocks[0]],()=>[0]):{ev:[],total:0};
  Object.assign(MT,{pre:pre.ev,preDur:pre.total,i:0,start:MT.ctx.currentTime+0.12,vis:[],playing:true,songId:s.id,loop:loopId||null});
  MT.timer=setInterval(()=>{let e;while((e=mNext())&&e.at<MT.ctx.currentTime+0.15){clickAt(e.at,e.acc);MT.vis.push(e);MT.i++}
    if(!e&&MT.vis.length&&MT.ctx.currentTime>MT.vis[MT.vis.length-1].at+0.6)mStop()},25);
  const draw=()=>{if(!MT.playing)return;const now=MT.ctx.currentTime;let cur=null;while(MT.vis.length>1&&MT.vis[1].at<=now)MT.vis.shift();if(MT.vis[0]&&MT.vis[0].at<=now)cur=MT.vis[0];
    mPaint(cur);MT.raf=requestAnimationFrame(draw)};draw()}
function mStop(){clearInterval(MT.timer);cancelAnimationFrame(MT.raf);const was=MT.playing;MT.playing=false;MT.loop=null;if(was)mPaint(null,true)}
function mPaint(e,stopped){const s=songById(MT.songId);const st=$('#metroStat');
  document.querySelectorAll('.row.mplaying,.bar.mbar').forEach(x=>{if(!e||x.dataset.bid!==e.bid&&x.id!=='bar-'+(e&&e.bar))x.classList.remove('mplaying','mbar')});
  if(!e){if(st&&stopped)st.textContent='止めました';return}

  if(st)st.innerHTML=e.count?`<b>カウント ${e.beat}</b>`:`<b>${esc(bl?bl.name:'')}</b> ${e.bar+1}小節目 ・ ${e.beat}拍 <span class="sub">♩${Math.round(blockBpm(bl,s)*(S.prefs.mRate||1))}${MT.loop?' ・ 繰り返し中':''}</span>`;
  if(!e.count){document.querySelectorAll('.row[data-bid]').forEach(r=>r.classList.toggle('mplaying',r.dataset.bid===e.bid));

function playerSong(){return songById(PL.songId)}
function blockRange(s,bid){const i=s.blocks.findIndex(b=>b.id===bid);const b=s.blocks[i];const st=b&&blockTime(s,b);if(st==null)return null;

/* ---------- chord grid ---------- */
function chordTab(bl){
  const noKey=S.prefs.degree&&keyTonic(blockKey(bl,curSong()))==null;
  return `<div class="legend hstack"><button class="tagbtn ${S.prefs.degree?'on':''}" data-act="toggleDegree" title="Keyから見た度数で表示">ディグリー表示</button>${noKey?'<span style="color:var(--accent)">曲かブロックのKeyを入れると度数になります</span>':''}
    <span class="spacer"></span><button class="foldbtn" data-act="uiToggle" data-k="help">？ 記号の意味</button></div>
  ${UI('help')?'<div class="legend panel">1マス = 8分 ・ 空白 = 前のコードが続く ・ ⌒ = 前の小節からタイ ・ ★ = 仮置き ・ － = メロディ的な動き ・ ? = 分からない ・ 1小節だけ拍子を変えるときは小節番号をクリック</div>':''}
  <div id="grid">${bl.bars.map((_,i)=>barHTML(bl,i)).join('')}</div>`}
const COMMON_METERS=['4/4','3/4','2/4','5/4','6/4','7/4','6/8','7/8','5/8','9/8','12/8'];
const normMeter=m=>String(m||'').trim().replace(/[／]/g,'/').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
function meterSlots(m){const x=normMeter(m).match(/^(\d{1,2})\/(2|4|8|16)$/);if(!x)return 0;const n=+x[1],d=+x[2];const v=d===2?n*4:d===4?n*2:n;return n>0&&v<=32?v:0}
const songMeterDefault=s=>{const m=normMeter(s&&s.meter).split(/[,、\s]+/).find(meterSlots);return m||'4/4'};
const blockMeter=(bl,s)=>bl.meter||songMeterDefault(s);
const barMeter=(bl,bar,s)=>bar.m||(bar.n===meterSlots(blockMeter(bl,s))?blockMeter(bl,s):null);
function resizeBar(bar,n){bar.cells=Array.from({length:n},(_,i)=>bar.cells[i]||'');bar.n=n}
function barHTML(bl,bi){
  const bar=bl.bars[bi];let cells='';const bm=barMeter(bl,bar,curSong());const den=bm?+bm.split('/')[1]:0;
  for(let i=0;i<bar.n;i++){const c=bar.cells[i]||'';const sel=P&&P.bar===bi&&P.slot===i;
    const beat=den===4?i%2===0:den===8?true:(bar.n%2===0&&bar.n<=8?i%2===0:true);
    cells+=`<div class="cell ${c?'start':''} ${beat?'beat':''} ${i===0?'first':''} ${sel?'sel':''}" data-act="cell" data-bar="${bi}" data-slot="${i}">${esc(showC(c,bl))}</div>`}
  return `<div class="bar" id="bar-${bi}"><button class="bn" data-act="barN" data-bar="${bi}" title="この小節だけ拍子・マス数を変える">${bi+1}${bm!==blockMeter(bl,curSong())?`<small>${bm||bar.n+'マス'}</small>`:''}</button>
  <div class="cells" style="grid-template-columns:repeat(${bar.n},1fr)">${cells}</div>
  <input class="lyric" data-input="lyric" data-bar="${bi}" value="${esc(bar.lyric)}" placeholder="歌詞・メモ"></div>`}
function refreshBar(bi){const bl=curBlock();const el=$('#bar-'+bi);if(bl&&el&&bl.bars[bi])el.outerHTML=barHTML(bl,bi)}

// コードの種類は「3度・7th・テンション」を組み合わせて作る(例 m + M7 → mM7、M7 + 9 → M7(9))
const TENS=['♭9','9','♯9','11','♯11','♭13','13','add9','♭5','♯5'];
const normT=x=>x.trim().replace(/^b/,'♭').replace(/^#/,'♯').replace(/^-/,'♭').replace(/^\+/,'♯');
function parseQ(q){q=(q||'').replace(/maj7/i,'M7').replace(/^min/,'m');
  const legacy={'m7-5':'m7(♭5)','9':'7(9)','m9':'m7(9)','M9':'M7(9)','69':'6(9)','m69':'m6(9)','11':'7(9,11)','13':'7(13)','7-5':'7(♭5)','7+5':'7(♯5)','M':''};
  if(q in legacy)q=legacy[q];
  const m=q.match(/^(m|dim|aug)?(M7|7|6)?(sus[24])?(add9)?(?:\(([^)]*)\))?$/);if(!m||(m[1]&&m[3]))return null;
  const r={tri:m[3]||m[1]||'',sev:m[2]||'',ten:m[4]?['add9']:[]};
  if(m[5])for(const x of m[5].split(/[,，、]/)){const v=normT(x);if(!TENS.includes(v))return null;r.ten.push(v)}
  return r}
function composeQ({tri,sev,ten}){const s=tri.startsWith('sus')?sev+tri:(tri==='m'&&sev==='M7'?'mM7':tri+sev);
  let t=[...new Set(ten)].sort((a,b)=>TENS.indexOf(a)-TENS.indexOf(b));
  if(!sev&&t.length===1&&t[0]==='add9')return s+'add9';
  t=t.map(x=>x==='add9'?'9':x);t=[...new Set(t)];
  return s+(t.length?`(${t.join(',')})`:'')}
function parseChord(c){const p={root:'',acc:'',q:'',bass:'',bassAcc:'',tie:false,lit:'',slash:false,last:'root'};
  if(c.startsWith('⌒')){p.tie=true;c=c.slice(1)}
  const m=c.match(/^([A-G])([b#♭♯]?)(.*?)(?:\/([A-G])([b#♭♯]?))?$/);
  if(m){p.root=m[1];p.acc=m[2];p.q=m[3];p.bass=m[4]||'';p.bassAcc=m[5]||''}else p.lit=c;return p}
function compose(p){const s=p.root?p.root+p.acc+p.q+(p.bass?'/'+p.bass+p.bassAcc:''):p.lit;return (p.tie?'⌒':'')+s}
function posLabel(bm,i){if(bm&&bm.endsWith('/4'))return `${Math.floor(i/2)+1}拍目${i%2?'ウラ':''}`;if(bm&&bm.endsWith('/8'))return `8分の${i+1}つ目`;return `${i+1}マス目`}
function selectCell(bar,slot){const bl=curBlock();const old=P&&P.bar;
  P=Object.assign(parseChord(bl.bars[bar].cells[slot]||''),{bar,slot});
  if(old!=null&&old!==bar)refreshBar(old);refreshBar(bar);renderSheet(true);
  setTimeout(()=>{const b=$('#bar-'+bar),sh=$('#sheet .sheet');if(!b||!sh)return;const r=b.getBoundingClientRect(),top=sh.getBoundingClientRect().top,head=$('.top').getBoundingClientRect().bottom;
    if(r.bottom>top-8)window.scrollBy(0,r.bottom-top+16);else if(r.top<head+4)window.scrollBy(0,r.top-head-12)},40)}
function writeCell(v){const bl=curBlock();bl.bars[P.bar].cells[P.slot]=v;save();refreshBar(P.bar)}
const curQ=()=>P.qp&&composeQ(P.qp)===P.q?P.qp:parseQ(P.q);
function editQ(fn){if(!P.root)return toast('先にルート音(C〜B)を選んでください');const q=curQ()||{tri:'',sev:'',ten:[]};fn(q);P.qp=q;P.q=composeQ(q);P.last='root';applyParts()}
function applyParts(){writeCell(compose(P));renderSheet(true)}
function move(d){const bl=curBlock();let bar=P.bar,slot=P.slot;const st=S.prefs.step;
  if(st==='bar'){bar+=d;slot=0}
  else{slot+=d*st;while(bl.bars[bar]&&slot>=bl.bars[bar].n){slot-=bl.bars[bar].n;bar++}
    while(slot<0&&bar>0){bar--;slot+=bl.bars[bar].n}}
  if(bar<0){bar=0;slot=0}
  if(bar>=bl.bars.length){bar=bl.bars.length-1;slot=bl.bars[bar].n-1}
  if(slot<0)slot=0;selectCell(bar,slot)}
function prevChord(){const s=curSong(),bl=curBlock();let bi=P.bar,si=P.slot-1;
  const blocks=s.blocks.slice(0,s.blocks.indexOf(bl)+1).reverse();
  for(const b of blocks){if(b!==bl){bi=b.bars.length-1;si=b.bars[bi].n-1}
    for(;bi>=0;bi--){for(;si>=0;si--){const c=(b.bars[bi].cells[si]||'').replace(/^⌒/,'');if(c)return c}if(bi>0)si=b.bars[bi-1].n-1}}
  return ''}
// よく使うコードの種類(ボタン一覧)。値は3度・7th・テンションの組み立てと同じ書き方
const PRESETS=[['','M'],['m','m'],['7','7'],['M7','M7'],['m7','m7'],['6','6'],['m6','m6'],['sus4','sus4'],['7sus4','7sus4'],['add9','add9'],['m7(♭5)','m7♭5'],['dim','dim'],['dim7','dim7'],['aug','aug'],['mM7','mM7'],['7(9)','9']];
function presetName(v){const r=chordDesc({root:'C',acc:'',q:v,bass:'',tie:false});return r.replace(/^C /,'')}
// いま選んでいるコードの読み方(例: Cm7 → C マイナー・セブンス)
function chordDesc(p){
  if(!p.root)return ({'?':'分からないところ','★':'仮置き(あとで確認)','－':'メロディ的な動き','N.C.':'休み(ノーコード)'})[p.lit]||(p.lit?'':'ルート音を選んでください');
  const q=parseQ(p.q);const acc=a=>a==='b'||a==='♭'?'♭':a==='#'||a==='♯'?'♯':'';let d='';
  if(q){const T={'':'メジャー',m:'マイナー',sus4:'サスフォー',sus2:'サスツー',dim:'ディミニッシュ',aug:'オーギュメント'}[q.tri];
    const V={'':'','6':'シックス','7':'セブンス','M7':'メジャーセブンス'}[q.sev];
    d=q.tri==='m'&&q.sev==='M7'?'マイナー・メジャーセブンス':q.tri===''?(V||'メジャー'):q.tri==='dim'&&q.sev==='7'?'ディミニッシュセブンス':T+(V?'・'+V:'');
    if(q.ten.includes('add9'))d+='・アドナインス';const ten=q.ten.filter(x=>x!=='add9');if(ten.length)d+=`(テンション ${ten.join(',')})`}
  else if(p.q)d=p.q;
  return `${p.root}${acc(p.acc)} ${d}${p.bass?` / ベース ${p.bass}${acc(p.bassAcc)}`:''}${p.tie?'・前の小節からタイ':''}`}
function renderSheet(focus){
  const el=$('#sheet');
  if(!P||R.name!=='block'||R.c==='memo'||!curBlock()){el.innerHTML='';document.body.classList.remove('sheet-open');return}

  const roots=['C','D','E','F','G','A','B'];
  const qp=P.root?curQ():null;
  const tris=[['','M(メジャー)'],['m','m(マイナー)'],['sus4','sus4'],['sus2','sus2'],['dim','dim'],['aug','aug']],sevs=[['','なし'],['6','6'],['7','7'],['M7','M7']];
  const steps=[[1,'8分'],[2,'1拍'],[4,'2拍'],['bar','1小節']];
  const accOn=a=>(P.last==='bass'?P.bassAcc:P.acc)===a;
  document.body.classList.add('sheet-open');
  const tonic=keyTonic(blockKey(bl,curSong()));const deg=tonic!=null&&val?toDegree(val,tonic):'';
  const curQs=P.root?composeQ(qp||{tri:'',sev:'',ten:[]}):null;
  const bassMode=P.slash||P.last==='bass';
  el.innerHTML=`<div class="sheet"><div class="sheet-in">
  <div class="cs-head">
    <div class="cs-now"><div class="pos">${P.bar+1}小節目・${posLabel(barMeter(bl,bar,curSong()),P.slot)}</div>
      <div class="cs-name" id="csName">${val?esc(val):'<span class="cs-empty">空き(前のコードが続く)</span>'}</div>
      <div class="cs-desc" id="csDesc">${esc(chordDesc(P))}${deg?` ・ <b>${esc(deg)}</b>`:''}</div></div>
    <div class="cs-nav"><button data-act="pMove" data-v="-1" title="前のマス">←</button><button class="primary" data-act="pMove" data-v="1">次 →</button><button class="ghost" data-act="pClose" title="閉じる">✕</button></div>
  </div>
  <div class="cs-lab">${bassMode?'<b class="hl">ベース音</b>を選ぶ(分数コードの「／」の下の音)':'① ルート音'}</div>
  <div class="keys roots">${roots.map(r=>`<button class="${(!bassMode&&P.root===r)||(bassMode&&P.bass===r&&!P.slash)?'on':''}" data-act="pRoot" data-v="${r}">${r}</button>`).join('')}
    <button class="acc ${accOn('b')?'on':''}" data-act="pAcc" data-v="b" title="フラット(もう一度押すと戻る)">♭</button><button class="acc ${accOn('#')?'on':''}" data-act="pAcc" data-v="#" title="シャープ(もう一度押すと戻る)">♯</button></div>
  <div class="cs-lab">② 種類 <span class="sub">よく使うものから選ぶ</span></div>
  <div class="keys presets ${P.root?'':'dim'}">${PRESETS.map(([v,l])=>`<button class="${P.root&&curQs===composeQ(parseQ(v)||{tri:'',sev:'',ten:[]})?'on':''}" data-act="pPreset" data-v="${esc(v)}" title="${esc(presetName(v))}">${l}</button>`).join('')}</div>
  <button class="cs-more" data-act="uiToggle" data-k="qadv">③ 細かく組み立てる(3度・7th・テンション)${UI('qadv')?' ▾':' ▸'}</button>
  ${UI('qadv')?`<div class="keys qrow"><span class="qlab">3度</span>${tris.map(([v,l])=>`<button class="${qp&&qp.tri===v?'on':''}" data-act="pTri" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="keys qrow"><span class="qlab">7th</span>${sevs.map(([v,l])=>`<button class="${qp&&qp.sev===v?'on':''}" data-act="pSev" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="keys qrow"><span class="qlab">テンション</span>${TENS.map(v=>`<button class="${qp&&qp.ten.includes(v)?'on':''}" data-act="pTen" data-v="${v}">${v}</button>`).join('')}</div>`:''}
  <div class="cs-lab">その他</div>
  <div class="keys tools"><button class="${P.slash?'on':''}" data-act="pSlash" title="分数コード: 次に押すルート音がベース音になります">／ベース音</button><button data-act="pPrev">↺ 前と同じ</button>
    <button class="${P.tie?'on':''}" data-act="pTie" title="前の小節から音を伸ばす">⌒ タイ</button><button data-act="pLit" data-v="N.C." title="休み(ノーコード)">N.C. 休み</button>
    <button data-act="pLit" data-v="?" title="分からない">? 不明</button><button data-act="pLit" data-v="★" title="仮置き(あとで確認)">★ 仮</button><button data-act="pLit" data-v="－" title="メロディ的な動き">－ 動き</button><button data-act="pDel">⌫ 消す</button></div>
  <div class="cs-foot"><input id="chordIn" value="${esc(val)}" autocomplete="off" spellcheck="false" placeholder="直接入力 例 Bm7, F#m/A">
    <div class="steps"><span>「次」で進む</span>${steps.map(([v,l])=>`<button class="${S.prefs.step===v?'on':''}" data-act="pStep" data-v="${v}">${l}</button>`).join('')}</div></div>
  </div></div>`;
  if(focus&&!TOUCH){const i=$('#chordIn');i.focus();i.select()}

// 写真ボード: 幅1000の仮想キャンバスに写真を自由に置く。表示は画面幅×拡大率で縮尺する
let BZ=1;
function boardHTML(bl){const photos=bl.memos.filter(m=>m.kind==='photo');
  photos.forEach((m,i)=>{if(m.x==null){m.x=20+(i%2)*500;m.y=20+Math.floor(i/2)*420;m.w=460}});
  return `<div class="board-tools hstack"><span class="sub">ドラッグで移動・右下の ◢ で大きさ・タップで全画面・2本指(PCはCtrl+ホイール)で拡大縮小</span><span class="spacer"></span>
    <button data-act="bZoom" data-v="-1">－</button><span id="bzv" class="sub">${Math.round(BZ*100)}%</span><button data-act="bZoom" data-v="1">＋</button><button data-act="bZoom" data-v="0">全体</button></div>
  <div class="board-wrap" id="boardWrap"><div class="board-sizer" id="boardSizer"><div class="board" id="board">${photos.map(m=>`<div class="bp" data-mid="${m.id}" style="left:${m.x}px;top:${m.y}px;width:${m.w}px">
    <img data-blob="${m.blobId}" draggable="false" alt=""><input class="bp-cap" value="${esc(m.name||'')}" data-input="memoName" data-id="${m.id}" placeholder="説明">
    <span class="bp-rs">◢</span><button class="bp-del" data-act="delMemo" data-id="${m.id}" title="削除">✕</button></div>`).join('')}</div></div></div>`}
function boardH(bl){return Math.max(700,...bl.memos.filter(m=>m.kind==='photo').map(m=>m.y+(m.h||m.w*0.75)+60))}
function layoutBoard(){const w=$('#boardWrap'),b=$('#board'),sz=$('#boardSizer'),bl=curBlock();if(!w||!b||!bl)return;
  const k=w.clientWidth/1000*BZ,H=boardH(bl);b.style.height=H+'px';b.style.transform=`scale(${k})`;sz.style.width=1000*k+'px';sz.style.height=H*k+'px';

    const fit=()=>{if(img.naturalWidth&&m){const h=Math.round(img.naturalHeight/img.naturalWidth*m.w);if(m.h!==h){m.h=h;save();layoutBoard()}}};

  const bp=e.target.closest('.bp');if(!bp||e.target.closest('.bp-del,.bp-cap'))return;
  e.preventDefault();const m=findMemo(bp.dataset.mid).m;const k=wrap.clientWidth/1000*BZ;
  BD={m,el:bp,mode:e.target.closest('.bp-rs')?'rs':'mv',sx:e.clientX,sy:e.clientY,x0:m.x,y0:m.y,w0:m.w,h0:m.h||m.w*0.75,k,moved:0};
  try{bp.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!bptr.has(e.pointerId))return;bptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!BD)return;
  if(BD.pinch){if(bptr.size<2)return;const [a,b]=[...bptr.values()];setBZ(BD.z0*Math.hypot(a.x-b.x,a.y-b.y)/BD.d0);e.preventDefault();return}
  const dx=(e.clientX-BD.sx)/BD.k,dy=(e.clientY-BD.sy)/BD.k;BD.moved=Math.max(BD.moved,Math.abs(dx*BD.k)+Math.abs(dy*BD.k));const m=BD.m;
  if(BD.mode==='mv'){m.x=Math.round(Math.min(1000-m.w*0.3,Math.max(-m.w*0.7,BD.x0+dx)));m.y=Math.round(Math.max(0,BD.y0+dy));BD.el.style.left=m.x+'px';BD.el.style.top=m.y+'px'}

  e.preventDefault()},{passive:false});

const U=v=>(v===''||v==null||(Array.isArray(v)&&!v.length))?undefined:v;

// 共有データ v2: 項目名を省いた配列にしてから圧縮する。リンクは英数字(1文字6bit)、共有コードは漢字(1文字14bit)で書く

async function packBytes(d){const cs=new Blob([new TextEncoder().encode(JSON.stringify(d))]).stream().pipeThrough(new CompressionStream('deflate-raw'));

async function unpackShared(code){

  if(Array.isArray(d)&&d[0]===3)return {setlist:d[1]||'共有セトリ',studio:d[2]||null,songs:(d[3]||[]).map(arrSong)};
  if(d&&d.v===1&&Array.isArray(d.b))return {songs:[d]};

function b64(blob){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)})}
async function doExport(){const blobs={};for(const id of songBlobIds(S.songs)){const b=await getBlob(id);if(b)blobs[id]=await b64(b)}
  const data=JSON.stringify({app:'kopiban',exported:new Date().toISOString(),state:S,blobs});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  const d=new Date();a.download=`コピバン練習ノート_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;a.click();toast('書き出しました')}
async function doImport(file){try{const j=JSON.parse(await file.text());if(j.app!=='kopiban'||!j.state)throw new Error('このアプリのバックアップではありません');
  if(!confirm('今のデータをバックアップの内容で置き換えます。よろしいですか？'))return;
  await idb('blobs','readwrite',s=>s.clear());for(const [id,u] of Object.entries(j.blobs||{}))await putBlob(id,await (await fetch(u)).blob());
  S=j.state;save();location.hash='#/';render();toast('復元しました')}catch(e){alert('読み込めませんでした: '+e.message)}}

  mOffNow(){const s=curSong();if(!M.kind)return;s.mOffset=Math.round(M.time()*100)/100;MS.last=null;save();render();toast('1小節目を '+s.mOffset.toFixed(2)+' 秒にしました')},
  bLoop(t){const id=t.dataset.id;PL.loop=PL.loop===id?null:id;if(PL.loop){const r=blockRange(curSong(),id);if(r){M.seek(r.start);M.play()}}render()},
  bMark(t){const b=curSong().blocks.find(x=>x.id===t.dataset.id);b.start=Math.round(M.time()*10)/10;save();render();toast(`「${b.name}」の頭を ${fmtT(b.start)} にしました`)},
  pickFiles(){pickMode='memo';const f=$('#filePick');f.accept='image/*,audio/*,video/*';f.value='';f.click()},
  rec:toggleRec,
  addText(){curBlock().memos.push({id:uid(),kind:'text',text:'',ts:Date.now()});render();const a=document.querySelectorAll('textarea');a[a.length-1]?.focus()},
  delMemo(t){const {m,b}=findMemo(t.dataset.id);if(!m||!confirm('このメモを削除しますか？'))return;if(m.blobId)delBlob(m.blobId);b.memos=b.memos.filter(x=>x!==m);render()},
  async lb(t){$('#overlay').innerHTML=`<div class="lb" data-act="lbClose"><img src="${await blobURL(t.dataset.id)}" data-act="lbZoom"></div><button class="lbx" data-act="lbClose">✕</button>`},
  lbZoom(t,e){e.stopPropagation();t.parentElement.classList.toggle('zoom')},
  lbClose(){$('#overlay').innerHTML=''},
  cycleTheme(){const o=['auto','light','dark'];S.prefs.theme=o[(o.indexOf(S.prefs.theme||'auto')+1)%3];render()},
  async doPrint(){await Promise.all([...document.querySelectorAll('.pv img')].map(i=>i.complete&&i.src?0:new Promise(r=>{i.onload=i.onerror=r;setTimeout(r,1500)})));
    const t=document.title;document.title=(songById(R.a)||(PENDING&&{title:PENDING.setlist||PENDING.songs[0].title})||{title:t}).title;measureMaps();
    window.print();document.title=t},
  export:doExport,
  import(){const f=$('#importPick');f.value='';f.click()},
  delBand(){const b=band();if(!confirm(`バンド「${b.name}」と、その曲・セトリを全部削除しますか？`))return;
    const songs=S.songs.filter(s=>s.bandId===b.id);songBlobIds(songs).forEach(delBlob);
    S.songs=S.songs.filter(s=>s.bandId!==b.id);S.setlists=S.setlists.filter(x=>x.bandId!==b.id);S.bands=S.bands.filter(x=>x!==b);S.cur.band=S.bands[0].id;S.cur.setlist=null;render()},
};
const CHG={
  band(t){if(t.value==='__new'){newBand();if(t.value==='__new')render();return}S.cur.band=t.value;S.cur.setlist=null;location.hash='#/';render()},
  pickSetlist(t){S.cur.setlist=t.value;location.hash='#/setlist/'+t.value;render()},

  addExisting(t){if(t.value){curSetlist().songIds.push(t.value);render()}},
  blockType(t){curBlock().type=t.value;render()},
  mRate(t){S.prefs.mRate=+t.value;save();if(MT.playing)toast('次に再生したときから反映されます')},
  mCount(t){S.prefs.mCount=t.checked;save()},
  mSync(t){const s=curSong();s.mSync=t.checked;if(t.checked){mStop();ensureCtx()}render()},
  mOffset(t){const s=curSong();const v=parseFloat(String(t.value).replace(/[－−]/,'-'));s.mOffset=isNaN(v)?0:Math.round(v*100)/100;t.value=s.mOffset.toFixed(2);MS.last=null;save()},
  mkColor(t){S.markers[+t.dataset.i].color=t.value;render()},
  mkName(t){const m=S.markers[+t.dataset.i],n=t.value.trim();if(!n||n===m.name){render();return}
    if(S.markers.some(x=>x.name===n)){toast('同じ名前があります');render();return}
    S.songs.forEach(s=>s.blocks.forEach(b=>b.tags=b.tags.map(x=>x===m.name?n:x)));m.name=n;render()},
  shareStudio(t){S.prefs.shareStudio=t.checked;save();openShare('setlist')},
  studioTime(t){const st=curSetlist().studio,k=t.dataset.k;const box=t.parentElement;const h=box.querySelector('[data-p=h]').value,m=box.querySelector('[data-p=m]').value;
    st[k]=h?h+':'+m:'';$('#stSum').innerHTML=studioSum(st)},
  songMeter(){const s=curSong();const n=meterSlots(songMeterDefault(s));
    const bars=s.blocks.filter(b=>!b.meter).flatMap(b=>b.bars.filter(x=>!x.m&&x.n!==n));
    if(!bars.length){render();return}
    if(bars.some(x=>x.cells.slice(n).some(Boolean))&&!confirm('拍子を変えると、はみ出すマスのコードが消えます。よろしいですか？(ブロックごとに拍子を決めてあるところはそのままです)')){render();return}
    bars.forEach(x=>resizeBar(x,n));render();toast('拍子 '+songMeterDefault(s)+' に合わせました')},
  blockMeter(t){const s=curSong(),bl=curBlock();const prev=bl.meter;let v=t.value;
    if(v==='__other'){v=normMeter(prompt('拍子を入力 (例 7/4, 11/8, 15/16)',bl.meter||''));if(!meterSlots(v)){if(v)toast('「7/4」のように「数/2・4・8・16」で入れてください');render();return}}
    bl.meter=v;const n=meterSlots(blockMeter(bl,s));
    const targets=bl.bars.filter(b=>!b.m&&b.n!==n);
    if(targets.some(b=>b.cells.slice(n).some(Boolean))&&!confirm('拍子を変えると、はみ出すマスのコードが消えます。よろしいですか？')){bl.meter=prev;render();return}
    targets.forEach(b=>resizeBar(b,n));P=null;render()},
  printOpt(t){S.prefs[t.dataset.k]=t.checked;render()},
  theme(t){S.prefs.theme=t.value;render()},
  barsCount(t){const bl=curBlock();const n=Math.max(1,Math.min(64,parseInt(t.value)||1));
    if(n<bl.bars.length&&bl.bars.slice(n).some(b=>b.cells.some(Boolean)||b.lyric)&&!confirm(`${n+1}小節目以降のコードと歌詞が消えます。よろしいですか？`)){t.value=bl.bars.length;return}
    while(bl.bars.length<n)bl.bars.push(newBar(meterSlots(blockMeter(bl,curSong()))));bl.bars.length=n;if(P&&P.bar>=n)P=null;render()},
};
const INP={
  songField(t){curSong()[t.dataset.k]=t.value},
  blockField(t){curBlock()[t.dataset.k]=t.value},
  lyric(t){curBlock().bars[+t.dataset.bar].lyric=t.value},
  memoName(t){findMemo(t.dataset.id).m.name=t.value},
  memoText(t){findMemo(t.dataset.id).m.text=t.value},
  bandName(t){band().name=t.value},
  studio(t){const st=curSetlist().studio;st[t.dataset.k]=t.value;$('#stSum').innerHTML=studioSum(st);$('#stDays').textContent=daysLeft(st.date)},
  shareBase(t){S.prefs.shareBase=t.value.trim()},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t){ACT[t.dataset.act](t,e)}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-change]');if(t)CHG[t.dataset.change](t,e)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='chordIn'&&P){let v=t.value.replace(/^(⌒?)([a-g])/,(m,a,b)=>a+b.toUpperCase()).replace(/\/([a-g])/,(m,b)=>'/'+b.toUpperCase());const keep=Object.assign(parseChord(v),{bar:P.bar,slot:P.slot});P=keep;writeCell(v);const cn=$('#csName'),cd=$('#csDesc');if(cn)cn.textContent=v;if(cd){const tn=keyTonic(blockKey(curBlock(),curSong()));cd.textContent=chordDesc(P)+(tn!=null&&v?' ・ '+toDegree(v,tn):'')}return}
  if(t.dataset.input){INP[t.dataset.input](t);save()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#overlay').innerHTML){ACT.lbClose();return}if(P){ACT.pClose();return}}
  if(e.key===' '&&!P&&!/INPUT|TEXTAREA|SELECT|BUTTON|AUDIO/.test(e.target.tagName)&&$('#player').style.display!=='none'){e.preventDefault();M.paused()?M.play():M.pause();return}
  if(e.target.id==='chordIn'&&e.key==='Enter'){e.preventDefault();move(e.shiftKey?-1:1);return}
  if(P&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
    if(e.key==='ArrowRight'){e.preventDefault();const s=S.prefs.step;S.prefs.step=1;move(1);S.prefs.step=s}
    else if(e.key==='ArrowLeft'){e.preventDefault();const s=S.prefs.step;S.prefs.step=1;move(-1);S.prefs.step=s}
    else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();ACT.pDel()}}});
// reorder by dragging the ⋮⋮ handle (mouse and touch)
let pdrag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');const row=h&&h.closest('[data-drag]');if(!row)return;
  e.preventDefault();pdrag={k:row.dataset.drag,from:+row.dataset.idx,to:+row.dataset.idx};row.classList.add('dragging');
  try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!pdrag)return;e.preventDefault();
  const el=document.elementFromPoint(e.clientX,e.clientY);const r=el&&el.closest(`[data-drag="${pdrag.k}"]`);
  document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));
  if(r){pdrag.to=+r.dataset.idx;if(pdrag.to!==pdrag.from)r.classList.add('dragover')}
  if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>innerHeight-70)window.scrollBy(0,14)},{passive:false});
function endPdrag(){if(!pdrag)return;const {k,from,to}=pdrag;pdrag=null;
  document.querySelectorAll('.dragover,.dragging').forEach(x=>x.classList.remove('dragover','dragging'));
  if(from!==to){const arr=k==='sl'?curSetlist().songIds:curSong().blocks;const [x]=arr.splice(from,1);arr.splice(to,0,x);render()}}
document.addEventListener('pointerup',endPdrag);document.addEventListener('pointercancel',endPdrag);
let drag=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(t){drag={k:t.dataset.drag,i:+t.dataset.idx};e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#drop');
  if(z&&!drag){e.preventDefault();z.classList.add('over');return}
  const t=e.target.closest&&e.target.closest('[data-drag]');if(drag&&t&&t.dataset.drag===drag.k){e.preventDefault();document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));t.classList.add('dragover')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{
  if(!drag&&R.name==='song'&&e.dataTransfer.files.length){e.preventDefault();setSongAudio(curSong(),e.dataTransfer.files[0]);return}
  const z=e.target.closest&&e.target.closest('#drop');
  if(z&&!drag&&e.dataTransfer.files.length){e.preventDefault();handleFiles([...e.dataTransfer.files]);return}
  const t=e.target.closest&&e.target.closest('[data-drag]');
  if(drag&&t&&t.dataset.drag===drag.k){e.preventDefault();const arr=drag.k==='sl'?curSetlist().songIds:curSong().blocks;const to=+t.dataset.idx;
    const [x]=arr.splice(drag.i,1);arr.splice(to,0,x);render()}
  drag=null});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'))});
window.addEventListener('dragover',e=>{if(!drag)e.preventDefault()});
window.addEventListener('drop',e=>{if(!drag)e.preventDefault()});
document.addEventListener('paste',e=>{if(R.name!=='block'||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const files=[...e.clipboardData.files];if(files.length){e.preventDefault();handleFiles(files)}});
$('#filePick').addEventListener('change',e=>{const fs=[...e.target.files];if(pickMode==='song')setSongAudio(curSong(),fs[0]);else handleFiles(fs)});
$('#importPick').addEventListener('change',e=>{if(e.target.files[0])doImport(e.target.files[0])});
window.addEventListener('hashchange',()=>{P=null;$('#overlay').innerHTML='';render();window.scrollTo(0,0)});

(async()=>{
  initPlayer();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  DB=await openDB();
  S=await idb('kv','readonly',s=>s.get('state'))||defaultState();
  S.prefs=S.prefs||{step:2};
  S.markers=S.markers||DEFAULT_MARKERS.map(([name,color])=>({name,color}));
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  render();
})();
</script>
</body>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* iPhone・iPadでは、文字の小さい入力欄を押したときに画面が勝手に拡大されるのを止める(指での拡大縮小はそのままできる) */
if(/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))document.querySelector('meta[name=viewport]').content+=',maximum-scale=1'</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="コピバンノート">
<meta name="theme-color" content="#11161d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>コピバン練習ノート</title>
<style>
:root{
  /* 配色: 方眼ノートに青ペンで書き込むイメージ。色だけに頼らず、色の見え方が違う人にも区別しやすい組み合わせにする */
  --bg:#11161d;--panel:#18202a;--panel2:#212b37;--line:#2e3a48;--text:#e8edf3;--sub:#9aa6b4;
  --accent:#6b9cf5;--accent2:#8fb4f7;--accbg:#6b9cf522;--accbg2:#6b9cf544;--ok:#2bb38a;--live:#e8893a;--rec:#e0533d;
  --topbg:#11161dee;--sheetbg:#161d26f5;--hover:#ffffff08;--beat:#364353;--start:#6f7d8d;--muted:#566474;--shadow:#0008;
  --inbg:#0c1117;--inline:#3e4b5a;--btnsh:#00000080;color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f5f7;--panel:#ffffff;--panel2:#e9eef4;--line:#d3dae2;--text:#1b2430;--sub:#5d6977;
  --accent:#1d4ed8;--accent2:#3b67e0;--accbg:#1d4ed814;--accbg2:#1d4ed833;--ok:#0f8a66;--live:#c2410c;--rec:#c2361f;
  --topbg:#f3f5f7ee;--sheetbg:#f8fafcf5;--hover:#0000000a;--beat:#cfd7e0;--start:#8593a3;--muted:#a3aebb;--shadow:#0f172a24;
  --inbg:#ffffff;--inline:#bac4cf;--btnsh:#0f172a1a;color-scheme:light;
}
@media (prefers-color-scheme:light){:root[data-theme=auto]{
  --bg:#f3f5f7;--panel:#ffffff;--panel2:#e9eef4;--line:#d3dae2;--text:#1b2430;--sub:#5d6977;
  --accent:#1d4ed8;--accent2:#3b67e0;--accbg:#1d4ed814;--accbg2:#1d4ed833;--ok:#0f8a66;--live:#c2410c;--rec:#c2361f;
  --topbg:#f3f5f7ee;--sheetbg:#f8fafcf5;--hover:#0000000a;--beat:#cfd7e0;--start:#8593a3;--muted:#a3aebb;--shadow:#0f172a24;
  --inbg:#ffffff;--inline:#bac4cf;--btnsh:#0f172a1a;color-scheme:light;
}}
*{box-sizing:border-box}
html.appscroll,html.appscroll body{height:100%;overflow:hidden}html.appscroll #app{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:none;border-color:transparent;color:var(--sub)}
button.ghost:hover{color:var(--text)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
/* ボタンと入力欄を見分けられるように: ボタンは少し浮かせ、文字を入れる欄は白(ダークでは黒)でへこませる */
button:not(.ghost):not(.foldbtn):not(.bn):not(.kk){box-shadow:0 1px 2px var(--btnsh)}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]):not([readonly]):not(.name):not(.lyric),textarea{background:var(--inbg);border-color:var(--inline);box-shadow:inset 0 1px 2px var(--btnsh)}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]):not([readonly]):focus,textarea:focus{border-color:var(--accent)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
/* ホーム画面のアプリ(特にiPadのウインドウ表示)では、画面の上の端にOSの帯がかぶって、ぼかしがかかる。上のバーの中身はその下から始める */
header.top{padding-top:max(8px,env(safe-area-inset-top))}
/* iPadのホーム画面アプリでは、画面の上の端にOSのガラスの効果がかかって文字がにじむ(「透明度を下げる」で消えることで確認)。上のバーの文字をその帯より下に置く */
html.ipadapp header.top{padding-top:36px}
.brand{font-weight:700}
.bandsel{color:var(--sub);font-size:13px}
.bandsel select{margin-left:4px}
.top nav{margin-left:auto;display:flex;gap:4px}
.top nav a{padding:6px 14px;border-radius:5px;color:var(--sub)}
.top nav a.on{color:var(--accent);background:var(--accbg)}
main{max-width:980px;margin:0 auto;padding:20px 20px 260px}
h1{font-size:24px;margin:4px 0 6px}
.back{color:var(--accent);font-size:14px}
.sub{color:var(--sub);font-size:13px}
.hstack{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:14px 0}
/* 左の色の帯は角の丸みに沿って曲がらないよう、枠線ではなく背景で描く(内側の線がまっすぐになる) */
.studio{--bc:var(--accent);background-image:linear-gradient(90deg,var(--bc) 0 5px,transparent 5px)}
.addbtn{background-image:linear-gradient(90deg,var(--bc) 0 5px,transparent 5px);padding-left:16px}
.studio .big{font-size:20px;font-weight:700}
.studio input{font-size:13px}
.studio.live{--bc:var(--live)}.evchip{font-size:13px;font-weight:700;padding:2px 10px;border-radius:10px;background:var(--accbg);color:var(--accent)}
.studio.live .evchip{background:color-mix(in srgb,var(--live) 15%,transparent);color:var(--live)}.evnext{font-size:11px;font-weight:700;margin-left:6px;padding:2px 8px;border-radius:10px;background:var(--accent);color:#fff}
.studio.live .evnext{background:var(--live)}.evdel{padding:2px 8px;margin-left:4px}.evpast .studio{opacity:.6}
.sec.hstack{gap:6px}.sec.hstack button{font-size:13px;padding:5px 10px}
.sec{display:flex;align-items:center;margin:22px 0 8px;font-weight:700}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--hover)}
.row .num{color:var(--sub);width:18px;text-align:center}
.row .body{flex:1;min-width:0;display:block}
.row .title{font-weight:700}
.row.dragover{box-shadow:inset 0 3px 0 var(--accent)}
.handle{cursor:grab;color:var(--muted);user-select:none}
.strip{display:flex;gap:2px;height:7px;margin-top:7px;border-radius:4px;overflow:hidden}
.strip.big{height:22px;border-radius:6px}
.strip.big div{display:flex;align-items:center;justify-content:center;font-size:10px;color:#000a;font-weight:700;overflow:hidden;white-space:nowrap;cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;margin:6px 4px 0 0}
.tagbtn{font-size:12px;padding:3px 9px;border-radius:6px}
.tagbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accbg)}
.deg{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap}
.metro .hstack{gap:8px}.mstat{font-size:13px;color:var(--sub);margin-top:6px;font-variant-numeric:tabular-nums;min-height:1.4em}
.mstat b{color:var(--accent);font-size:15px}
.btitle{display:flex;align-items:center;gap:8px;margin-top:10px}
.btitle .cbar{width:6px;height:34px;flex:0 0 auto}
.btitle .name{flex:1;min-width:0;font-size:20px;font-weight:700;background:none;border-color:transparent;padding:4px 2px}
.btitle .name:focus{border-color:var(--accent)}
.foldbtn{font-size:13px;padding:5px 10px;white-space:nowrap}.foldbtn.on{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:6px 0 0 14px}
.chip{font-size:12px;color:var(--sub);background:var(--panel2);border-radius:6px;padding:2px 8px}
.chips .tag{margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px}
/* ブロック設定: 1行目 種類・小節数 / 2行目 拍子・テンポ・Key / 3行目 メモ / マーカー。項目名は入力欄の上に小さく */
.blockhead.panel{display:flex;flex-direction:column;align-items:stretch;gap:10px}
.brow{display:grid;gap:8px;align-items:end;max-width:560px}
.brow.b2{grid-template-columns:2fr 1fr}
.brow.b3{grid-template-columns:1.3fr 1fr 1fr}
.brow.b1{grid-template-columns:1fr}
.frow{display:flex;flex-direction:column;gap:3px;min-width:0}
.frow>span{font-size:11px;color:var(--sub)}
.frow>select,.frow>input{width:100%;min-width:0}
.frow.mkrow>span{padding-top:0}
.mkbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sendbtn{width:100%;padding:12px;font-size:16px;margin:4px 0 12px}
.memo-ta{width:100%;resize:vertical;min-height:2.6em;line-height:1.4}
.chip{white-space:pre-line}.mtable .mnote{white-space:pre-line}
/* コード入力パネル */
.cs-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.cs-now{flex:1;min-width:0}
.cs-name{font-size:28px;font-weight:800;line-height:1.15;min-height:1.15em;word-break:break-all}
.cs-empty{font-size:15px;font-weight:400;color:var(--sub)}
.cs-desc{font-size:12px;color:var(--sub);min-height:1.3em}.cs-desc b{color:var(--accent)}
.cs-nav{display:flex;gap:6px;align-items:center}.cs-nav button{padding:8px 12px}
.cs-lab{font-size:12px;color:var(--sub);margin:8px 0 2px}.cs-lab .hl{color:var(--accent)}
.keys.presets.dim{opacity:.45}
.keys .acc{min-width:46px}
/* Musician Keyboard 風キーボード */
.kb{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.kr{display:grid;gap:5px}.kr.r10{grid-template-columns:repeat(10,1fr)}.kr.r9{grid-template-columns:repeat(7,1fr) 1fr 1fr}
.kr.r9:nth-child(4){grid-template-columns:repeat(9,1fr)}
.kr.kfoot{grid-template-columns:repeat(4,1fr)}
/* 「次 →」は選択中(塗りつぶし)と見分けがつくよう、枠と文字だけオレンジにする */
.kk.knext{background:var(--panel2);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.kr.r9.ksyms{grid-template-columns:repeat(7,1fr)}
.kr.r8{grid-template-columns:repeat(8,1fr)}
.kk.kmark{font-size:18px;background:var(--panel2)}
@media (pointer:coarse){.cs-foot.kbd-on #chordIn{display:block;width:100%;flex-basis:100%}}
.kk{min-width:0;padding:10px 0;font-size:16px;font-weight:600;border-radius:5px;background:var(--panel);box-shadow:0 1px 0 var(--line)}
.kk.kroot{font-size:18px}.kk.kacc{font-size:18px;background:var(--panel2)}.kk.kq{color:var(--accent)}
.kk.ksym{font-size:14px}.kk.kfn{background:var(--panel2);font-size:14px}
.kk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.kk.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media screen and (max-width:420px){.kk{padding:9px 0;font-size:14px}.kk.kroot,.kk.kacc{font-size:16px}.kr.r10 .kk{font-size:13px;letter-spacing:-.3px}.kk.ksym{font-size:12px}}
.symlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 16px;font-size:13px}
.cp-sec{margin-top:12px}.cp-h{font-size:12px;color:var(--sub);margin-bottom:6px}.cp-btn{width:100%;margin-bottom:8px;padding:10px}
.cp-range{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}.cp-range select{min-width:64px}.cp-all{width:100%}
.cp-now{margin-bottom:8px;font-size:14px;overflow-wrap:anywhere}.cp-note{margin:0;font-size:12px}
.impcode{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--panel2)}.impcode b{font-size:14px}
.impcode .hstack{flex-wrap:nowrap}.impcode input{min-width:0;font-size:16px;font-weight:700;letter-spacing:1px}.impcode button{flex:none}
.cj-mode{display:flex;gap:6px;margin-top:10px}.cj-mode button{flex:1;padding:8px 0}.cj-mode button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cj-kbw{overflow-x:auto;margin:10px 0 8px;-webkit-overflow-scrolling:touch}
.cj-kb{position:relative;height:130px;display:flex;min-width:max(100%,630px);user-select:none;-webkit-user-select:none;touch-action:pan-x}
/* 候補が増えても鍵盤・音ボタンの位置が動かないように、各段の高さを固定する */
.cj-seq{display:flex;align-items:center;gap:6px;height:44px;margin:10px 0 6px}
.cj-chips{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.cj-chip{padding:4px 10px;border-radius:10px;background:var(--panel2);font-weight:700}.cj-chip.bass{background:var(--accent);color:#fff}.cj-arr{color:var(--sub);font-size:12px}
.cj-opts{display:flex;align-items:center;gap:8px;margin-top:8px;height:34px}.cj-acc{display:flex;gap:4px}
.cj-acc button{padding:4px 12px;min-width:44px}.cj-acc button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cj-pcs button{white-space:nowrap;letter-spacing:-1px}@media screen and (max-width:420px){.cj-pcs button{font-size:14px}}
.cj-hint{margin:-4px 0 8px;font-size:11px}
.cj-pcs{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:10px}.cj-pcs button{padding:12px 0;font-size:16px;font-weight:700;min-width:0}.cj-pcs button.acc{background:var(--panel2)}
.cj-kb button{min-width:0;margin:0;-webkit-tap-highlight-color:transparent}
.cj-w{flex:1;height:100%;padding:0 0 6px;background:#f6f4ef;color:#888;border:1px solid #bbb;border-radius:0 0 6px 6px;font-size:10px;display:flex;align-items:flex-end;justify-content:center}
.cj-b{position:absolute;top:0;height:60%;width:calc(100% / 14 * 0.62);padding:0 0 4px;background:#222;color:#fff;border:1px solid #000;border-radius:0 0 4px 4px;z-index:2;font-size:9px;display:flex;align-items:flex-end;justify-content:center}
.cj-w.on{background:var(--accent);border-color:var(--accent);color:#fff}.cj-b.on{background:var(--accent);border-color:var(--accent2)}
.cj-tools{gap:6px;margin-bottom:10px;flex-wrap:nowrap}.cj-tools>.sub{flex:1;min-width:0;height:2.6em;line-height:1.3;overflow:hidden}.cj-tools>.spacer{display:none}.cj-tools button{white-space:nowrap;flex:none}.cj-bass{font-size:12px}.cj-cands{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;height:128px;overflow-y:auto}
.cj-cands button{font-size:18px;font-weight:700;padding:8px 14px;line-height:1.2}.cj-cands button small{display:block;font-size:10px;font-weight:400;opacity:.75;margin-top:2px}.cj-cands button.top{background:var(--accent);border-color:var(--accent);color:#fff}
.mpick .mp-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 8px}
.mpick select{font-size:22px;padding:8px 14px;min-width:84px;text-align:center}.mpick .mp-sl{font-size:26px;color:var(--sub)}
.symlist div{display:grid;grid-template-columns:6.5em 1fr;gap:8px;align-items:baseline}.symlist b{color:var(--text);line-height:1.4}.symlist span{color:var(--sub);min-width:0}
.cs-more{width:100%;margin-top:8px;font-size:13px;text-align:left;background:none;border-style:dashed}
.cs-foot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cs-foot #chordIn{width:200px;font-size:16px;padding:6px 8px}
.cs-foot .steps{margin-left:auto}
@media (pointer:coarse){.cs-foot #chordIn{display:none}}
.calopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:12px 14px;margin-top:8px;font-size:15px}
.calopt span{font-size:12px;color:var(--sub)}
.sh-lab{margin-top:8px}.sh-row{flex-wrap:nowrap}.sh-row input{min-width:0}
.toolrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.toolrow .mstat{margin:0}
.metro.closed{display:flex;align-items:center;gap:10px;padding:8px 12px}.metro.closed .mstat{margin:0}
.panel.metro-b{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.shortbox{background:var(--panel2);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.shortcode{flex:1;min-width:0;width:100%;font-size:26px!important;font-weight:800;letter-spacing:4px;text-align:center;font-family:ui-monospace,Consolas,monospace}
.pl-mini{display:none;align-items:center;gap:8px;flex:1;min-width:0}
.pm-play{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;background:var(--accent);border-color:var(--accent);color:#fff;flex:0 0 auto}
/* iPhoneの標準のシークバーは、0のときもつまみが右にずれて見えるので、線とつまみを自前で描く */
#pmSeek{flex:1;min-width:0;height:28px;margin:0;padding:0;border:0;box-shadow:none;-webkit-appearance:none;appearance:none;background:transparent;--p:0%}
#pmSeek::-webkit-slider-runnable-track,.m-vol input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0 0/var(--p) 100% no-repeat,var(--line)}
#pmSeek::-webkit-slider-thumb,.m-vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--accent);border:none}
#pmSeek::-moz-range-track,.m-vol input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#pmSeek::-moz-range-progress,.m-vol input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
#pmSeek::-moz-range-thumb,.m-vol input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none}
.pm-time{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.pm-more{font-size:20px;padding:4px 8px}
.url-stat{font-size:12px;margin-top:4px;line-height:1.5}.url-stat:empty{display:none}.url-stat .ok{color:var(--ok);font-weight:600}.url-stat .ng{color:var(--accent)}
.m-anchor{margin:2px 0 4px;max-width:100%}
.m-vol{gap:10px}.m-vol label{display:flex;align-items:center;gap:4px;flex:1;min-width:0}.m-vol input[type=range]{flex:1;min-width:60px;height:28px;margin:0;padding:0;border:0;box-shadow:none;-webkit-appearance:none;appearance:none;background:transparent;--p:0%}
.msync{margin-top:8px;gap:6px}.msync button{padding:3px 7px;font-size:12px}
.m-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.m-head{margin-top:0}.m-from{flex:1;min-width:0}
.m-rate{display:flex;align-items:center;gap:6px;white-space:nowrap}
.m-sync{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.m-offlab{margin-top:8px}
.m-off{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr 1fr;gap:6px;margin-top:4px}.m-off button{padding:7px 0;font-size:13px;min-width:0}
.m-off input{width:100%;min-width:0;text-align:center;font-variant-numeric:tabular-nums}.m-now{margin-top:8px;width:100%}
.sec-hint{margin:-4px 0 8px;font-size:12px}
.metro-b{margin-top:10px;gap:6px}.metro-b .mstat{margin:0}
#ytWrap iframe{display:block;border-radius:6px;width:240px;height:135px}
@media screen and (max-width:700px){#ytWrap iframe{width:160px;height:90px}}
#spWrap iframe{display:block;border-radius:8px;width:280px;height:80px;border:0}
@media screen and (max-width:700px){#spWrap iframe{width:200px}}

.bar.mbar .cells{outline:2px solid var(--accent);outline-offset:1px}

.cbar{width:5px;align-self:stretch;border-radius:3px}

.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.adds button{font-size:13px}
.empty{color:var(--sub);text-align:center;padding:40px}
.counts{color:var(--sub);font-size:12px;white-space:nowrap}
.rowbtns{display:flex;gap:2px;opacity:.35}
.row:hover .rowbtns{opacity:1}
.rowbtns button{padding:3px 7px;font-size:12px}
/* block */
.blockhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blockhead .name{font-size:20px;font-weight:700;width:180px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px;margin:14px 0}
.tabs a{flex:1;text-align:center;padding:7px;border-radius:5px;color:var(--sub)}
.tabs a.on{background:var(--panel2);color:var(--text);font-weight:700}
.legend{color:var(--sub);font-size:12px;margin-bottom:8px}
.bar{display:grid;grid-template-columns:34px 1fr;column-gap:6px;margin-bottom:6px}
.bn{background:none;border:none;color:var(--sub);padding:0;font-size:13px;text-align:right;line-height:1.1}
.bn small{display:block;font-size:10px;color:var(--accent)}
.cells{display:grid;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:36px;overflow:hidden}
.cell{padding:8px 4px 8px 6px;font-size:14px;font-weight:600;white-space:nowrap;overflow:visible;cursor:pointer;position:relative;min-width:0}
.cell.beat::before{content:"";position:absolute;left:0;top:30%;bottom:30%;border-left:1px dotted var(--beat)}
/* 拍の頭でないマスにも短い目盛りを入れて、1マス = 8分音符1つ分 が見て分かるようにする */
.cell:not(.beat)::before{content:"";position:absolute;left:0;top:40%;bottom:40%;border-left:1px solid var(--beat)}
.cell.start::before{top:0;bottom:0;border-left:2px solid var(--start)}
.cell.first::before{display:none}
.cell:hover{background:var(--hover)}
.cell.sel{background:var(--accent);color:#fff}
.cell .ct{position:absolute;left:var(--cpl,6px);top:0;bottom:0;display:flex;align-items:center;width:calc(var(--sp,1) * 100% - var(--cpl,6px) - 2px);overflow:hidden;white-space:nowrap;pointer-events:none;z-index:2}
.cell{min-height:36px}
.lyric{grid-column:2;margin-top:3px;background:none;border:none;border-bottom:1px dashed transparent;border-radius:0;padding:2px 4px;font-size:13px;color:var(--sub)}
.lyric:hover,.lyric:focus{border-bottom-color:var(--line)}
/* sheet */
#sheet .sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheetbg);border-top:1px solid var(--line);box-shadow:0 -10px 30px var(--shadow);padding:12px 20px 16px}

.pos{color:var(--sub);font-size:12px}

.steps{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.steps button{padding:3px 8px;font-size:12px}
.steps button.on,.keys button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.keys{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.keys button{min-width:52px;padding:7px 8px;font-weight:600}

.qrow{align-items:center}.qlab{font-size:11px;color:var(--sub);width:58px;flex:0 0 auto}
.kbd{font-size:11px;color:var(--sub);margin-left:auto}
/* memo */

.photo{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.photo img{width:100%;height:180px;object-fit:cover;display:block;cursor:zoom-in;background:#000}
.photo .cap{display:flex;gap:4px;padding:6px}

.memo-item{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px}

.memo-item input{width:220px}
.memo-item textarea{flex:1;min-height:60px;resize:vertical}
.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:700}
.lb{position:fixed;inset:0;z-index:50;background:#000e;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:zoom-out}

.lb.zoom{display:block}

.lbx{position:fixed;top:14px;right:18px;z-index:51;font-size:20px}
.note{font-size:13px;color:var(--sub);line-height:1.7}
.themebtn{padding:5px 10px}
.menubtn{font-size:20px;line-height:1;padding:4px 10px;position:relative}.menubtn.on{color:var(--accent)}.menubtn .newdot{position:absolute;top:2px;right:4px}
.drawer-bg{position:fixed;inset:0;background:#0007;z-index:49}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);background:var(--panel);z-index:50;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:-10px 0 30px var(--shadow);animation:drawIn .18s ease-out}
@keyframes drawIn{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.msec{font-size:12px;color:var(--sub);margin:16px 0 6px}
.mline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;font-size:14px}
.mseg{display:flex;gap:4px}.mseg button{padding:5px 9px;font-size:13px;white-space:nowrap}.mseg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mlist{display:flex;flex-direction:column}.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:13px 4px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:none!important;box-shadow:none!important;text-align:left;font-size:15px;color:var(--text)}
.mrow:last-child{border-bottom:none}.mi{width:1.6em;text-align:center}
#tour{position:fixed;inset:0;z-index:70}
.tour-spot{position:fixed;border-radius:6px;box-shadow:0 0 0 9999px #000a;outline:2px solid var(--accent);pointer-events:none;
  transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1),border-radius .3s}
.tour-bub{position:fixed;left:12px;right:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:0 10px 30px var(--shadow);max-width:520px;margin:0 auto;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .22s ease-out,transform .22s ease-out}
.tour-bub.in{opacity:1;transform:none;pointer-events:auto}
.tour-spot.tap{animation:tourPulse 1.1s ease-in-out infinite}
@keyframes tourPulse{0%,100%{outline-width:2px;outline-offset:0}50%{outline-width:4px;outline-offset:3px}}
.tour-ripple{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--accent);pointer-events:none;animation:tourRip .48s ease-out forwards;z-index:2}
@keyframes tourRip{0%{transform:scale(.3);opacity:.8}100%{transform:scale(2);opacity:0}}
.bunsetsu{overflow-wrap:anywhere;line-break:strict}/*nowrap-pretty-off*/
.tour-h{font-size:16px;display:block;margin:2px 0 4px}.tour-t{font-size:14px;line-height:1.7;max-height:38vh;overflow-y:auto}.tour-t.help{color:var(--sub)}
.tour-more{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tour-more button{padding:5px 10px;font-size:13px;border-radius:10px}
.tut-tocfoot{flex-wrap:nowrap}.tut-tocfoot button{white-space:nowrap;padding-left:10px;padding-right:10px}.tut-toc{max-height:52vh;overflow-y:auto;margin:4px 0 10px}.tut-toc h3.tut-sec{font-size:15px;margin:18px 0 2px;padding-top:10px;border-top:1px solid var(--line)}.tut-toc h3.tut-sec:first-child{margin-top:0;padding-top:0;border-top:0}.tut-secp{margin:0 0 4px}
.tut-q{width:100%;margin:6px 0 2px;font-size:16px}

.help-sec{font-size:17px;margin:22px 0 4px}.help-grp{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.help-item{display:block;margin:0 0 8px;scroll-margin-top:70px}.help-item .note{margin:4px 0 0}.help-more{margin-top:6px}.help-more summary{cursor:pointer;color:var(--accent);font-size:14px}.help-play{margin-top:6px;padding-left:0;color:var(--accent)}a.help-link{color:inherit}
.tut-toc h4{margin:10px 0 4px;font-size:12px;color:var(--sub);font-weight:600}.tut-toc button{display:block;width:100%;text-align:left;padding:8px 12px;margin:4px 0}
.song-audio{margin-top:12px}.song-acts{margin-top:10px;gap:8px}.song-acts button{padding:8px 14px}
.brow.bq{display:flex;gap:10px;align-items:flex-start}.brow.bq input[type=number]{width:80px}

.backlink{display:inline-block;color:var(--accent);margin:4px 0 2px;font-size:14px}
.histbtns{display:flex;gap:2px}.histbtns button{padding:4px 7px;font-size:17px;line-height:1;display:flex;align-items:center}.histbtns button:disabled{opacity:.3}
@media screen and (max-width:420px){header.top .bandsel select{max-width:86px}header.top .histbtns button{padding:4px 5px;font-size:16px}header.top nav a{padding:6px 5px}}
/* 使い方ガイド・お知らせ */
.tut-step{font-size:12px;color:var(--sub);margin:2px 0 6px}.tut h2{margin:4px 0 8px;font-size:19px}.tut .tut-p{margin:0 0 4px;line-height:1.7;overflow-y:auto}

.news-v{margin-top:10px}.news-v b{font-size:13px}.news-v ul{margin:4px 0 0;padding-left:1.2em;line-height:1.7;font-size:14px}

<script>
'use strict';
const TYPES={
  In:{label:'イントロ',short:'In',color:'#7b8794'},
  A:{label:'Aメロ',short:'A',color:'#009e73'},
  B:{label:'Bメロ',short:'B',color:'#0072b2'},
  S:{label:'サビ',short:'サビ',color:'#e69f00'},
  I:{label:'間奏',short:'間',color:'#aa33ff'},
  C:{label:'Cメロ',short:'C',color:'#56b4e9'},
  D:{label:'大サビ',short:'大',color:'#d55e00'},
  Out:{label:'アウトロ',short:'Out',color:'#7b8794'},
  X:{label:'その他',short:'他',color:'#5f6b79'},
};
const DEFAULT_MARKERS=[['キメ','#d55e00'],['拍子変化','#0072b2'],['転調','#009e73'],['テンポ注意','#e69f00'],['合いの手','#56b4e9'],['未確定','#7b8794']];
// 前の配色のままの既定マーカーは、新しい色に置き換える(自分で色を変えたものはそのまま)
const OLD_MARK={'#ff6a2b':'#d55e00','#7c7fd6':'#0072b2','#2fa58c':'#009e73','#e0b13a':'#e69f00','#4a8fd6':'#56b4e9','#9a938a':'#7b8794','#d64a8f':'#aa33ff','#cc79a7':'#aa33ff','#8fd64a':'#009e73'};
function recolorMarkers(){(S.markers||[]).forEach(m=>{const c=OLD_MARK[(m.color||'').toLowerCase()];if(c)m.color=c})}
const markerColor=n=>((S.markers||[]).find(m=>m.name===n)||{color:'#7b8794'}).color;
const tagHTML=(t,cls='tag')=>`<span class="${cls}" style="border-color:${markerColor(t)};color:${markerColor(t)}">${esc(t)}</span>`;
function ensureMarkers(names){names.forEach(n=>{if(n&&!S.markers.some(m=>m.name===n))S.markers.push({name:n,color:'#7b8794'})})}
// ディグリー表示: Keyの主音から見た度数(ローマ数字)に置き換えて表示する
const PCN={C:0,D:2,E:4,F:5,G:7,A:9,B:11},ACC={'b':-1,'♭':-1,'#':1,'♯':1};
const ROMAN=['Ⅰ','♭Ⅱ','Ⅱ','♭Ⅲ','Ⅲ','Ⅳ','♯Ⅳ','Ⅴ','♭Ⅵ','Ⅵ','♭Ⅶ','Ⅶ'];
function keyTonic(k){const m=String(k||'').trim().match(/^([A-G])([b#♭♯]?)/);return m?(PCN[m[1]]+(ACC[m[2]]||0)+12)%12:null}
function toDegree(c,tonic){if(tonic==null||!c)return c;let tie='';if(c.startsWith('⌒')){tie='⌒';c=c.slice(1)}
  const m=c.match(/^([A-G])([b#♭♯]?)(.*?)(?:\/([A-G])([b#♭♯]?))?$/);if(!m)return tie+c;
  const d=(r,a)=>ROMAN[(PCN[r]+(ACC[a]||0)-tonic+24)%12];return tie+d(m[1],m[2])+m[3]+(m[4]?'/'+d(m[4],m[5]):'')}
const blockKey=(bl,s)=>(bl&&bl.key)||(s&&s.key)||'';
// ドレミ表示: 表示だけルート音とベース音をカタカナにする(保存するデータはアルファベットのまま)
const DRM={C:'ド',D:'レ',E:'ミ',F:'ファ',G:'ソ',A:'ラ',B:'シ'};
const drm=s=>!S.prefs.doremi||!s?s:String(s).replace(/^(⌒?)([A-G])/,(m,t,r)=>t+DRM[r]).replace(/\/([A-G])/g,(m,r)=>'/'+DRM[r]);
const showC=(c,bl)=>S.prefs.degree?toDegree(c,keyTonic(blockKey(bl,curSong()))):drm(c);
const TOUCH=matchMedia('(pointer:coarse)').matches;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

/* ---------- storage (IndexedDB) ---------- */
let DB;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('kopiban',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('blobs')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idb(store,mode,fn){return new Promise((res,rej)=>{const tx=DB.transaction(store,mode);const req=fn(tx.objectStore(store));
  tx.oncomplete=()=>res(req&&req.result);tx.onerror=()=>rej(tx.error)})}
const putBlob=(id,b)=>idb('blobs','readwrite',s=>s.put(b,id));
const getBlob=id=>idb('blobs','readonly',s=>s.get(id));
// 写真・音源は「元に戻す」で復活できるように、その場では消さない。次に開いたときに、どこからも使われていないものだけ片付ける
const delBlob=()=>{};
async function gcBlobs(){try{const keys=await idb('blobs','readonly',s=>s.getAllKeys());const used=new Set(songBlobIds(S.songs));
  const drop=(keys||[]).filter(k=>!used.has(k));if(drop.length)await idb('blobs','readwrite',s=>{drop.forEach(k=>s.delete(k))})}catch(_){}}
let saveT;
let DEMO=null; // 案内用の見本を表示中(このあいだは保存しない)
/* ホーム画面のアプリでは、ページ全体ではなく #app の中をスクロールさせる。
   iPadのアプリ表示では、ページ全体がスクロールすると画面上端にOSのぼかしがかかって、上のバーの文字がにじむため */
const scrEl=()=>document.documentElement.classList.contains('appscroll')?document.getElementById('app'):null;
function scrBy(a,b){const s=scrEl()||window;if(typeof a==='object')s.scrollBy(a);else s.scrollBy(a,b)}
function scrTo0(){const s=scrEl();if(s)s.scrollTop=0;else window.scrollTo(0,0)}
const scrY=()=>{const s=scrEl();return s?s.scrollTop:scrollY};
const APP_VER='10/25 2:40';
function save(){if(DEMO)return;histTrack();clearTimeout(saveT);saveT=setTimeout(()=>idb('kv','readwrite',s=>s.put(S,'state')),250);syncSoon()}
/* ---------- Googleドライブで同期 ----------
   ログインした人のドライブに「kopiban-note-sync.json」を1つ作って、開いたときに新しいほうを取ってきて、変えたら数秒後に保存する。
   権限は「このアプリが作ったファイルだけ」(drive.file)。写真と録音は重いので同期しない(文字のデータだけ)。
   どの端末でいつ保存したかを覚えておいて、両方で変えていたときは、どちらを残すか聞く */
const GCLIENT='550031929022-h9544gmr7i7093osevvd9pv0li1s22dv.apps.googleusercontent.com';
const SYNC_NAME='kopiban-note-sync.json',SYNC_KEY='kbSync';
const SY={meta:(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return {}}})(),busy:false,t:null,lastPull:0,err:''};
const syncSave=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY.meta))}catch(e){}};
const syncData=()=>({bands:S.bands,songs:S.songs,setlists:S.setlists,markers:S.markers,gigs:S.gigs});
const syncHash=()=>{const j=JSON.stringify(syncData());let h=0;for(let i=0;i<j.length;i++)h=(h*31+j.charCodeAt(i))|0;return h+':'+j.length};
const devName=()=>/iPhone/.test(navigator.userAgent)?'iPhone':/iPad|Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1?'iPad':/Android/.test(navigator.userAgent)?'Android':'PC';
const syncReady=()=>!!(SY.meta.tok&&Date.now()<SY.meta.exp-60000);
const syncDirty=()=>SY.meta.hash!==syncHash();
const fmtWhen=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
function gisLoad(){return window.google&&google.accounts?Promise.resolve():new Promise((ok,ng)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>ng(new Error('Googleのログイン画面を読み込めませんでした'));document.head.appendChild(s)})}
// ログイン(ボタンを押したときだけ呼ぶ。押していないときに窓を開くとブラウザに止められるため)
async function syncLogin(){if(!GCLIENT)return toast('同期はまだ準備中です');try{await gisLoad()}catch(e){return alert(e.message)}
  const tc=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error){SY.err='ログインできませんでした';syncUI();return}
      Object.assign(SY.meta,{on:true,tok:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000});syncSave();SY.err='';syncPull(true).then(()=>{if(R.name==='import'||R.name==='s')fillImport()})},
    error_callback:()=>{SY.err='ログインの画面が閉じられました';syncUI()}});
  tc.requestAccessToken({prompt:SY.meta.on?'':'consent'})}
async function gapi(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+SY.meta.tok,...(opt.headers||{})}});
  if(r.status===401){SY.meta.exp=0;syncSave();throw new Error('auth')}if(!r.ok)throw new Error('Googleドライブとやりとりできませんでした('+r.status+')');return r}
async function syncFind(){if(SY.meta.fileId){try{const f=await (await gapi(`https://www.googleapis.com/drive/v3/files/${SY.meta.fileId}?fields=id,appProperties,trashed`)).json();if(f&&!f.trashed)return f}catch(e){if(e.message==='auth')throw e}}

function songMeta(s){return [s.bpm&&'♩'+esc(s.bpm),esc(s.meter),s.key&&'キー '+esc(s.key),totalBars(s)+'小節'].filter(Boolean).join(' ・ ')}

/* ---------- views ---------- */
function daysLeft(d){if(!d)return '';const t=new Date(d+'T00:00');const n=new Date();n.setHours(0,0,0,0);const x=Math.round((t-n)/864e5);
  return x>0?`あと${x}日`:x===0?'今日':'終了'}
/* ---------- 予定(スタジオ・本番) ----------
   セトリごとに何個でも持てる。前の形(sl.studio 1つだけ)は開いたときに予定1件に移す */
let CALID=null;const EV_T={studio:{l:'スタジオ',i:'🎸'},live:{l:'本番',i:'🎤'}};
function slEvents(sl){if(!sl.events){sl.events=[];const st=sl.studio;if(st&&(st.date||st.start||st.place))sl.events.push({id:uid(),type:'studio',date:st.date||'',start:st.start||'',end:st.end||'',place:st.place||''})}
  delete sl.studio;return sl.events}
const todayStr=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
const evKey=e=>(e.date||'9999')+(e.start||'99');
function evSorted(sl){return [...slEvents(sl)].sort((a,b)=>evKey(a)<evKey(b)?-1:1)}
document.addEventListener('focusout',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.change==='evDate'&&t.dataset.dirty){delete t.dataset.dirty;setTimeout(()=>{if(document.activeElement!==t)render()},50)}});
const evFind=id=>{for(const sl of [...S.setlists,...(S.gigs||[])])for(const e of sl.events||[])if(e.id===id)return {sl,e};return {}};
// セトリの予定 + そのイベントの本番(共有するとき用)
const slAllEvents=sl=>[...evSorted(gigOf(sl)).filter(e=>e.type==='live'),...evSorted(sl)];
// 予定の見出し(カレンダー・文章): セトリなら「バンド名 スタジオ(イベント名)」、イベントなら「イベント名 本番」
function evTitle(o,e){const T=(EV_T[e.type]||EV_T.studio).l;return o.bandId?`${bandNameOf(o.bandId)} ${T}(${gigOf(o).name})`:`${o.name} ${T}`}
function evSongs(o){if(o.bandId)return o.songIds.map(songById).filter(Boolean).map((s,i)=>`${i+1}. ${s.title}`).join('\n');

function evCard(e,isNext){const T=EV_T[e.type]||EV_T.studio;
  return `<div class="card studio ${e.type==='live'?'live':''}"><div class="hstack"><span class="evchip">${T.i} ${T.l}</span>${isNext?'<span class="evnext">次の予定</span>':''}<span class="spacer"></span><b id="evDays-${e.id}">${daysLeft(e.date)}</b>

// type: 'studio'(セトリ=バンドのスタジオ) か 'live'(イベントの本番)
function evSection(sl,type){type=type||'studio';const T=EV_T[type],all=evSorted(sl).filter(e=>(e.type==='live')===(type==='live')),t=todayStr(),up=all.filter(e=>!e.date||e.date>=t),past=all.filter(e=>e.date&&e.date<t).reverse();const nx=up.find(e=>e.date);
  return `<div class="sec hstack"><span>${type==='live'?'本番の日時':'スタジオの予定'}</span><span class="spacer"></span><button data-act="evAdd" data-v="${type}" ${sl.bandId?'':`data-g="${sl.id}"`}>＋ ${T.i} ${T.l}</button></div>

function studioSum(st){if(!st.date)return '<span class="sub">未設定</span>';const wd='日月火水木金土'[new Date(st.date+'T00:00').getDay()];

function studioEvent(sl,st){if(!st||!st.date)return null;const day=new Date(st.date+'T00:00'),d=ymd(day);

  else{const [h,m]=st.start.split(':').map(Number);let e=st.end;if(!e){const t=h*60+m+120;e=String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
    const n=new Date(day);if(e<=st.start)n.setDate(n.getDate()+1);start=d+'T'+st.start.replace(':','')+'00';end=ymd(n)+'T'+e.replace(':','')+'00'}

  return {title,start,end,allDay,place:st.place||'',desc:songs?'セトリ\n'+songs:''}}
function buildIcs(ev,uidv){const e=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const dt=(k,v)=>ev.allDay?`${k};VALUE=DATE:${v}`:`${k}:${v}`;
  const alarm=t=>['BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:'+t,'DESCRIPTION:'+e(ev.title),'END:VALARM'];
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kopiban-note//JP','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uidv+'@kopiban-note','DTSTAMP:'+now,

function mediaRate(){try{return M.kind==='sp'?1:M.kind==='yt'?(M.yt.getPlaybackRate()||1):($('#pa').playbackRate||1)}catch(_){return 1}}
function syncTick(){const s=playerSong();

const TENS=['♭9','9','♯9','11','♯11','♭13','13','add9','♭5','♯5'];

document.addEventListener('pointerup',endPdrag);document.addEventListener('pointercancel',endPdrag);
let drag=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(t){drag={k:t.dataset.drag,i:+t.dataset.idx};e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#drop');
  if(z&&!drag){e.preventDefault();z.classList.add('over');return}
  const t=e.target.closest&&e.target.closest('[data-drag]');if(drag&&t&&t.dataset.drag===drag.k){e.preventDefault();document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));t.classList.add('dragover')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{
  if(!drag&&R.name==='song'&&e.dataTransfer.files.length){e.preventDefault();setSongAudio(curSong(),e.dataTransfer.files[0]);return}
  const z=e.target.closest&&e.target.closest('#drop');
  if(z&&!drag&&e.dataTransfer.files.length){e.preventDefault();handleFiles([...e.dataTransfer.files]);return}
  const t=e.target.closest&&e.target.closest('[data-drag]');
  if(drag&&t&&t.dataset.drag===drag.k){e.preventDefault();const arr=drag.k==='sl'?curSetlist().songIds:curSong().blocks;const to=+t.dataset.idx;
    const [x]=arr.splice(drag.i,1);arr.splice(to,0,x);render()}
  drag=null});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'))});
window.addEventListener('dragover',e=>{if(!drag)e.preventDefault()});
window.addEventListener('drop',e=>{if(!drag)e.preventDefault()});
document.addEventListener('paste',e=>{if(R.name!=='block'||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const files=[...e.clipboardData.files];if(files.length){e.preventDefault();handleFiles(files)}});
$('#filePick').addEventListener('change',e=>{const fs=[...e.target.files];if(pickMode==='midi')loadMidi(fs[0]);else if(pickMode==='song')setSongAudio(curSong(),fs[0]);else handleFiles(fs)});
$('#importPick').addEventListener('change',e=>{if(e.target.files[0])doImport(e.target.files[0])});
window.addEventListener('hashchange',()=>{P=null;$('#overlay').innerHTML='';render();scrTo0()});

(async()=>{
  initPlayer();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)document.documentElement.classList.add('appscroll');
  if((matchMedia('(display-mode: standalone)').matches||navigator.standalone)&&(/iPad/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)))document.documentElement.classList.add('ipadapp');
  DB=await openDB();
  S=await idb('kv','readonly',s=>s.get('state'))||defaultState();
  S.prefs=S.prefs||{step:2};
  S.markers=S.markers||DEFAULT_MARKERS.map(([name,color])=>({name,color}));recolorMarkers();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(v=>{STORE_OK=v}).catch(()=>{});
  render();gcBlobs();if(SY.meta.on)syncPull()
  if(!S.prefs.tutDone&&!/^#\/(s|import)\//.test(location.hash))setTimeout(tourStart,400);
})();
</script>
